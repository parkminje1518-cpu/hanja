<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>지혜 탐험대</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gowun+Dodum&family=Noto+Serif+KR:wght@600;900&family=Press+Start+2P&display=swap">
<style>
/* 밤의 탐험 게임판 + 한지 문제 카드. 한 화면에 한 가지 일, 큰 터치 버튼. 일부러 어두운 한 가지 모습만 씀 */
:root{
  --bg:#130f26; --bg2:#1b1636; --panel:#221c44; --line:#3b3270; --text:#f3effd; --muted:#a79fcb;
  --gold:#f6c544; --gold-d:#a8780f; --red:#e9475f; --red-d:#94203a; --jade:#3fcf8e; --jade-d:#1d7a53; --sky:#63b0ff;
  --paper:#f4e7c7; --paper-ink:#2b2216; --paper-line:#cdb68a;
  --f-title:"Black Han Sans","Do Hyeon",system-ui,sans-serif;
  --f-ui:"Do Hyeon","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-px:"Press Start 2P",ui-monospace,monospace;
  --f-hz:"Noto Serif KR","Nanum Myeongjo","Batang",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:17px;line-height:1.5;min-height:100%;
  background-image:radial-gradient(circle at 20% 0%,rgba(99,176,255,.10),transparent 40%),radial-gradient(circle at 90% 10%,rgba(233,71,95,.10),transparent 35%),
  radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.5px);background-size:auto,auto,26px 26px;background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere}
#app{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;background:none;border:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
[hidden]{display:none!important}
.eyebrow{font-family:var(--f-px);font-size:10px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
.muted{color:var(--muted)}
h2{font-family:var(--f-ui);font-weight:400;font-size:26px;margin:0;line-height:1.2;text-wrap:balance}
h3{font-family:var(--f-ui);font-weight:400;margin:0}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}

/* 버튼 */
.btn{font-family:var(--f-ui);font-size:20px;border-radius:12px;padding:12px 20px;min-height:54px;border:3px solid transparent;transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(3px)}
.btn.gold{background:var(--gold);color:#2a1d00;border-color:#ffe08a;box-shadow:0 5px 0 var(--gold-d)}
.btn.red{background:var(--red);color:#fff;border-color:#ff8597;box-shadow:0 5px 0 var(--red-d)}
.btn.jade{background:var(--jade);color:#06281a;border-color:#8af0c1;box-shadow:0 5px 0 var(--jade-d)}
.btn.ghost{background:var(--bg2);border-color:var(--line);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.btn.big{font-size:22px;min-height:62px}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}

/* 코인, 상단 */
.coin{display:inline-flex;align-items:center;gap:8px;background:var(--bg2);border:2px solid var(--gold-d);border-radius:12px;padding:5px 12px 5px 6px;font-family:var(--f-ui);font-size:20px;font-variant-numeric:tabular-nums}
.coin i,.ci{font-style:normal;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#5a3d00;font-family:var(--f-hz);font-weight:900;font-size:15px;box-shadow:inset 0 -3px 0 var(--gold-d)}
.coin.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.15)}}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.back{font-family:var(--f-ui);font-size:19px;color:var(--muted);padding:8px 4px;min-height:44px}
.top .ttl{font-family:var(--f-ui);font-size:22px;flex:1;text-align:center;min-width:0}

/* 타이틀 */
.titleBlock{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding-block:14px 4px}
.bigTitle{font-family:var(--f-title);font-weight:400;font-size:clamp(46px,11vw,92px);line-height:1;color:var(--gold);letter-spacing:.02em;margin:0;
  text-shadow:3px 3px 0 #b5361f,6px 6px 0 #4a1530,9px 9px 0 rgba(0,0,0,.35)}
.subTitle{font-family:var(--f-px);font-size:10px;color:var(--muted);letter-spacing:.14em}
.floatHz{position:relative}
.floatHz span{position:absolute;font-family:var(--f-hz);font-weight:900;color:rgba(246,197,68,.13);pointer-events:none}

/* 등록 */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-family:var(--f-ui);font-size:18px}
.fields2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.seg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.seg button,.seg2 button{background:var(--bg2);border:2px solid var(--line);border-radius:10px;min-height:52px;font-family:var(--f-ui);font-size:19px}
.seg button[aria-pressed="true"],.seg2 button[aria-pressed="true"]{background:var(--gold);color:#2a1d00;border-color:#ffe08a}
.seg2{display:flex;gap:8px;flex-wrap:wrap}
.seg2 button{padding:0 18px}
select,input[type=text],input[type=password]{background:var(--bg2);border:2px solid var(--line);border-radius:10px;min-height:54px;padding:0 14px;font-size:20px;font-family:var(--f-ui);width:100%}
.err{color:#ff9aab;font-family:var(--f-ui);font-size:18px;min-height:1.4em;margin:0}
.plist{display:flex;flex-wrap:wrap;gap:10px}
.pchip{display:flex;align-items:center;gap:10px;background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:8px 14px 8px 8px;min-height:56px;font-family:var(--f-ui);font-size:18px;text-align:left}
.ava{flex:none;width:40px;height:40px;border-radius:10px;background:var(--sky);color:#0b2238;display:grid;place-items:center;font-family:var(--f-ui);font-size:20px}

/* 홈 */
.homeTop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px 14px 6px 6px;font-family:var(--f-ui);font-size:18px;text-align:left;min-height:54px}
.who small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);line-height:1.2}
.statusRow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.statusRow span{background:var(--bg2);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-size:15px}
.statusRow .stairTag{border-color:#c9a23a;color:#ffe9a8}
.statusRow b{font-family:var(--f-ui);font-weight:400;color:var(--gold);font-size:18px}
.bigBtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.bigBtn{position:relative;display:flex;align-items:center;gap:14px;text-align:left;border-radius:16px;padding:20px 18px;min-height:128px;border:3px solid;transition:transform .08s}
.bigBtn:active{transform:translateY(4px)}
.bigBtn.gold{background:linear-gradient(#ffd765,var(--gold));color:#2a1d00;border-color:#ffe9a3;box-shadow:0 7px 0 var(--gold-d)}
.bigBtn.red{background:linear-gradient(#ff6a80,var(--red));color:#fff;border-color:#ff9cab;box-shadow:0 7px 0 var(--red-d)}
.bigBtn .num{z-index:3;color:#fff;background:rgba(0,0,0,.55)!important;box-shadow:0 0 0 2px rgba(255,255,255,.7);position:absolute;top:6px;left:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.18);display:grid;place-items:center;font-family:var(--f-px);font-size:10px}
.bigBtn .bi{flex:none;width:72px;height:72px;border-radius:14px;background:rgba(0,0,0,.16);display:grid;place-items:center;font-family:var(--f-hz);font-weight:900;font-size:42px}
.bigBtn strong{display:block;font-family:var(--f-title);font-weight:400;font-size:clamp(26px,4.4vw,36px);line-height:1.1}
.bigBtn small{display:block;font-size:14px;opacity:.85;margin-top:4px;line-height:1.35}
.menu4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.menu4 button{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-ui);font-size:18px;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.menu4 i{font-style:normal;font-family:var(--f-hz);font-weight:900;font-size:30px;color:var(--gold);line-height:1.2}
.menu4 small{font-family:var(--f-body);font-size:12px;color:var(--muted)}

/* 주차, 활동 */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:9px}
.wk{position:relative;aspect-ratio:1;max-width:100%;background:var(--bg2);border:2px solid var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-ui);font-size:22px;line-height:1.1}
.wk small{font-size:11px;color:var(--muted);font-family:var(--f-body)}
.wk[aria-pressed="true"]{background:var(--gold);border-color:#ffe08a;color:#2a1d00}
.wk[aria-pressed="true"] small{color:#5a3d00}
.wk .done{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-family:var(--f-hz);font-size:12px;display:grid;place-items:center;border:2px solid var(--bg)}
.chip{background:var(--bg2);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px;min-height:40px}
.preview{font-family:var(--f-hz);font-weight:600;font-size:24px;color:var(--muted);letter-spacing:.15em;min-height:36px}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.act{display:flex;align-items:center;gap:14px;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px;min-height:104px;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.act .ai{flex:none;width:60px;height:60px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-hz);font-weight:900;font-size:32px}
.act strong{display:block;font-family:var(--f-ui);font-weight:400;font-size:22px}
.act small{display:block;color:var(--muted);font-size:14px;line-height:1.35}
.act .rw{display:inline-flex;align-items:center;gap:4px;margin-top:4px;color:var(--gold);font-family:var(--f-ui);font-size:15px}
.ai.y{background:rgba(246,197,68,.18);color:var(--gold)} .ai.r{background:rgba(233,71,95,.2);color:#ff8a9c}
.ai.g{background:rgba(63,207,142,.18);color:var(--jade)} .ai.b{background:rgba(99,176,255,.18);color:var(--sky)}

/* 퀴즈 */
.qtop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.prog .pt{display:flex;justify-content:space-between;font-family:var(--f-ui);font-size:17px;margin-bottom:6px}
.prog .pt b{font-weight:400;color:var(--gold);font-variant-numeric:tabular-nums}
.bar{height:16px;background:var(--bg2);border:2px solid var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--gold) 0 10px,#ffd96f 10px 20px);transition:width .3s}
.reward{background:var(--bg2);border:2px solid var(--gold-d);border-radius:12px;padding:6px 14px;text-align:center;min-width:132px}
.reward b{display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--f-ui);font-weight:400;font-size:26px;color:var(--gold);font-variant-numeric:tabular-nums}
.reward small{display:block;font-size:12px;color:var(--muted)}
.reward.pop b{animation:bump .35s}
.qwrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:stretch}
.qcard{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:26px 24px;display:flex;flex-direction:column;gap:12px;justify-content:center;min-height:300px;
  border:4px solid #e2cc9b;box-shadow:0 0 0 3px #8a6a32,0 8px 0 3px rgba(0,0,0,.35)}
.qcard::before,.qcard::after{content:"";position:absolute;width:14px;height:14px;background:#8a6a32;transform:rotate(45deg)}
.qcard::before{top:10px;left:10px}.qcard::after{bottom:10px;right:10px}
.qtag{align-self:flex-start;background:#3a2c18;color:var(--gold);font-family:var(--f-ui);font-size:15px;border-radius:6px;padding:2px 10px}
.qbig{font-family:var(--f-hz);font-weight:900;font-size:clamp(90px,16vw,150px);line-height:1;text-align:center}
.qq{font-family:var(--f-title);font-weight:400;font-size:clamp(26px,4.4vw,38px);line-height:1.25;text-wrap:balance}
.qhint{border-top:2px dashed var(--paper-line);padding-top:10px;font-size:15px;color:#6b5634}
.qopts{display:flex;flex-direction:column;gap:12px;justify-content:center}
.qo{display:flex;align-items:center;gap:14px;background:var(--bg2);border:3px solid var(--line);border-radius:12px;min-height:72px;padding:8px 14px;text-align:left;font-family:var(--f-ui);font-size:24px;transition:background .15s,opacity .2s}
.qo .L{flex:none;width:34px;height:34px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-family:var(--f-px);font-size:12px}
.qo .T{flex:1;min-width:0}
.qo.hz .T{font-family:var(--f-hz);font-weight:900;font-size:38px;line-height:1}
.swq{font-style:normal;display:inline-block;min-width:1.1em;border:2px dashed #ffd36a;border-radius:6px;color:#ffd36a;text-align:center;line-height:1.1;margin:0 1px}
.memoAct{grid-column:1/-1;border-color:#e9475f;background:linear-gradient(110deg,#3a1630,#25163a);box-shadow:0 5px 0 #7a1a3a}
.act .ai.mm{background:#e9475f;color:#fff}
.memoStar{font-style:normal;font-size:14px;background:#ffd36a;color:#3a1630;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.memoScore{font-family:var(--f-ui);font-size:15px;text-align:center;color:var(--muted)}
.memoScore b{color:var(--gold);font-weight:400}
.mres{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.mres .mr{display:flex;flex-direction:column;align-items:center;padding:6px 10px;border-radius:10px;background:#2a2340;font-size:13px}
.mres .mr b{font-family:var(--f-hz);font-size:30px;line-height:1.1}
.mres .l0{background:#1f5a3c}.mres .l1{background:#2c4a6a}.mres .l3{background:#5a1f2a}
.rainHud{width:100%;box-sizing:border-box;max-width:760px;margin:6px auto;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;font-family:var(--f-ui)}
.rainShield{display:flex;gap:5px}.rainShield i{width:30px;height:12px;border-radius:6px;background:linear-gradient(#ffe9a0,#f6b51e);box-shadow:0 0 10px rgba(255,210,90,.8),inset 0 -3px 0 rgba(0,0,0,.2);transition:.3s}
.rainShield i.off{background:#2a2440;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
.rainProg{height:10px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}.rainProg b{display:block;height:100%;width:0;background:linear-gradient(90deg,#6ad0ff,#b28cff);border-radius:6px;transition:width .3s}
.rainCombo{min-width:84px;text-align:right;color:#ffd36a;font-size:18px;text-shadow:0 0 12px rgba(255,180,60,.8)}
.rainBox{position:relative;width:100%;box-sizing:border-box;height:min(54vh,440px);max-width:760px;margin:0 auto;border-radius:22px;overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 80% at 50% 110%,#ff9a6a 0%,#c8508a 22%,#4a2a7a 48%,#160f36 78%,#0a0820 100%);box-shadow:0 0 0 2px #3a2a6a,0 18px 40px rgba(0,0,0,.45),inset 0 0 60px rgba(0,0,0,.5)}
.rainBox .stars{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 32% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 58% 22%,#ffe,transparent),radial-gradient(1px 1px at 78% 12%,#fff,transparent),radial-gradient(1.2px 1.2px at 88% 30%,#fff,transparent),radial-gradient(1px 1px at 22% 34%,#cdf,transparent),radial-gradient(1.4px 1.4px at 45% 40%,#fff,transparent),radial-gradient(1px 1px at 68% 44%,#fff,transparent);animation:rtw 3s ease-in-out infinite alternate;opacity:.9}
@keyframes rtw{to{opacity:.45}}
.rainBox .moon{position:absolute;right:9%;top:9%;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe6,#ffe6a0 60%,#e8b860);box-shadow:0 0 40px 10px rgba(255,230,160,.35)}
.rainBox .mtn{position:absolute;left:-5%;right:-5%;bottom:58px;height:46%;background:linear-gradient(#2a1a4a,#1a1030);clip-path:polygon(0 100%,0 62%,9% 40%,17% 55%,27% 22%,37% 50%,46% 34%,55% 58%,64% 28%,74% 48%,83% 18%,92% 44%,100% 30%,100% 100%);opacity:.9}
.rainBox .mtn.b{bottom:58px;height:30%;background:linear-gradient(#3a2058,#20123a);clip-path:polygon(0 100%,0 55%,12% 30%,24% 60%,36% 35%,50% 62%,62% 32%,76% 58%,88% 36%,100% 56%,100% 100%);opacity:1}
.rainBox .fog{position:absolute;left:-30%;width:160%;bottom:70px;height:70px;background:radial-gradient(50% 50% at 50% 50%,rgba(255,200,230,.22),transparent 70%);animation:rfog 14s linear infinite}
@keyframes rfog{from{transform:translateX(-10%)}to{transform:translateX(10%)}}
.rainBox .town{position:absolute;left:0;right:0;bottom:0;height:62px;background:linear-gradient(#1a1030,#0c0818);}
.rainBox .town:before{content:"";position:absolute;left:0;right:0;top:-22px;height:24px;background:#120b26;clip-path:polygon(0 100%,3% 60%,8% 40%,13% 60%,15% 100%,20% 100%,23% 55%,29% 30%,35% 55%,38% 100%,44% 100%,47% 62%,52% 42%,57% 62%,60% 100%,66% 100%,69% 50%,75% 28%,81% 50%,84% 100%,89% 100%,92% 58%,96% 40%,100% 58%,100% 100%)}
.rainBox .town:after{content:"";position:absolute;inset:8px 0 auto 0;height:8px;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,200,110,.85) 22px 28px,transparent 28px 60px);filter:blur(.4px)}
.rainBarrier{position:absolute;left:3%;right:3%;bottom:44px;height:46px;border-radius:50% 50% 0 0/100% 100% 0 0;border-top:3px solid rgba(255,220,130,.95);background:linear-gradient(rgba(255,220,130,.28),transparent 70%);box-shadow:0 -6px 24px rgba(255,200,90,.55);z-index:3;transition:.25s}
.rainBarrier.hit{border-color:#ff5a6a;box-shadow:0 -6px 30px rgba(255,60,80,.9);background:linear-gradient(rgba(255,60,90,.4),transparent 70%)}
.rainBox.shake{animation:rshk .35s}@keyframes rshk{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.rainMsg{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-family:var(--f-ui);font-size:16px;color:#ffe9c0;z-index:4;text-shadow:0 2px 6px #000}
.rainMsg .hz{font-family:var(--f-hz);font-size:22px;color:#ffd36a}
.rainCloud{position:absolute;width:132px;height:84px;z-index:2;transform:translateZ(0)}
.rainCloud:before{content:"";position:absolute;inset:4px 0 0 0;border-radius:44px 44px 36px 36px;background:radial-gradient(70% 90% at 40% 25%,#6a5aa8,#3a2c6a 60%,#241a48);box-shadow:inset 0 -8px 14px rgba(0,0,0,.35),inset 0 6px 10px rgba(255,255,255,.12),0 0 18px rgba(150,120,255,.45)}
.rainCloud:after{content:"";position:absolute;left:14px;right:14px;top:78px;height:46px;background:repeating-linear-gradient(105deg,transparent 0 9px,rgba(160,200,255,.55) 9px 11px);mask:linear-gradient(#000,transparent);-webkit-mask:linear-gradient(#000,transparent);animation:rdrip .5s linear infinite}
@keyframes rdrip{from{background-position:0 0}to{background-position:0 22px}}

.lobbyHero .lh{flex:none;width:84px;height:84px;border-radius:18px;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--f-hz);font-weight:900;font-size:46px;box-shadow:0 5px 0 var(--red-d)}
.lobbyHero strong{font-family:var(--f-title);font-weight:400;font-size:28px}
.lobbyHero p{margin:0;color:var(--muted)}
.howto{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.skillchips{display:flex;flex-wrap:wrap;gap:8px}
.skillchips span{background:var(--bg2);border:2px solid var(--line);border-radius:999px;padding:2px 12px 2px 6px;font-size:14px;display:flex;align-items:center;gap:6px}
.skillchips b{font-family:var(--f-hz);font-weight:900;font-size:20px;color:var(--gold)}
.skic{display:block;flex:none;border-radius:50%}
.skillchips span{padding:2px 12px 2px 3px!important}
.gskills span{display:inline-flex;align-items:center;gap:4px}
.gopt .skic{margin:0 auto}
.gans.hz{font-family:var(--f-hz);font-weight:900;font-size:34px}
.qrgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.qrc{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;background:var(--bg2);border:3px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.qrc.on{border-color:var(--gold);background:rgba(246,197,68,.12)}
.qrc .qrs{color:var(--gold);font-size:12px;letter-spacing:1px}
.qrc strong{font-family:var(--f-title);font-weight:400;font-size:20px}
.qrc small{color:var(--muted);font-size:13px}
.qrc em{font-style:normal;font-size:12px;color:var(--jade);line-height:1.35}
@media (max-width:820px){.qrgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.qrc:last-child{grid-column:1/-1}}
.cost{font-family:var(--f-ui);font-size:20px}
.meta{color:var(--muted);font-size:15px}
.needmsg{margin:0;color:#ff9aab;font-family:var(--f-ui);font-size:19px}
.gdh{margin:0;font-family:var(--f-title);font-size:26px;color:#d79a1e;letter-spacing:.1em}
.gcoin{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff4d0;border:3px solid #d79a1e;border-radius:14px;padding:8px 12px;font-family:var(--f-ui)}
.gcoin b{font-family:var(--f-title);font-weight:400;font-size:28px;color:#b8871a}
.gcoin span{font-size:15px;color:#5a4a20}
/* ===== 친구와 같이 하기 ===== */
.mpPanel{display:flex;flex-direction:column;gap:10px;background:linear-gradient(135deg,#2a3a7a,#3a2a6a);border:3px solid #63b0ff;border-radius:16px;padding:14px;box-shadow:0 4px 0 #1a1a4a}
.mpHint{margin:0;font-family:var(--f-ui);font-size:18px;line-height:1.45;color:#e0e8ff}
.mpHint b{color:#ffd36a;font-weight:400}
.mpRow{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.mpRow .big{flex:1;min-width:150px}
.mpRow input{flex:0 0 150px;font-family:var(--f-title);font-size:28px;letter-spacing:.2em;text-align:center;background:#120e28;border:3px solid #63b0ff;border-radius:12px;color:#fff;min-height:58px}
.mpCodeBox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#120e28;border:2px dashed #ffd36a;border-radius:14px;padding:8px 16px}
.mpCodeBox span{font-family:var(--f-ui);font-size:18px;color:#cfd8ff}
.mpCodeBox b{font-family:var(--f-title);font-weight:400;font-size:46px;letter-spacing:.15em;color:var(--gold);line-height:1}
.mpCodeBox small{font-family:var(--f-ui);font-size:16px;color:#cfd8ff}
.mpList{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mpP{display:flex;align-items:center;gap:8px;background:#1b1640;border:2px solid #4a5aa8;border-radius:12px;padding:6px 8px;min-height:58px;font-family:var(--f-ui)}
.mpP b{display:block;font-weight:400;font-size:17px;color:#fff}
.mpP small{font-size:14px;color:#b8c4ff}
.mpP.empty{justify-content:center;color:#8a90c0;border-style:dashed;font-size:15px}
@media (max-width:620px){.mpList{grid-template-columns:repeat(2,minmax(0,1fr))}.mpRow input{flex:1 1 100%}}

.big{border-radius:12px;padding:12px 20px;min-height:58px;font-family:var(--f-ui);font-size:21px;border:3px solid transparent}
.big.red{background:var(--red);color:#fff;border-color:#ff8597;box-shadow:0 5px 0 var(--red-d)}
.big.alt{background:var(--bg2);border-color:var(--line)}
.big.green{background:var(--jade);color:#06281a}
.game{position:fixed;inset:0;z-index:30;background:#f3eee0;color:#25211b;touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--f-body)}
.game canvas{display:block;touch-action:none}
.ghud{position:absolute;inset:0 0 auto;pointer-events:none;display:flex;flex-direction:column;gap:6px;background:linear-gradient(rgba(243,238,224,.92) 70%,rgba(243,238,224,0));
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 14px max(12px,env(safe-area-inset-left,0px))}
.gxp,.ghp{height:10px;border-radius:99px;background:rgba(37,33,27,.15);overflow:hidden}
.gxp i{display:block;height:100%;background:#2f6b55}
.gstat{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ghp{position:relative;width:min(260px,55%);height:22px;border-radius:8px;background:rgba(37,33,27,.25);border:2px solid #25211b;overflow:hidden}
.ghp i{display:block;height:100%;background:linear-gradient(#ff6a80,#c8372d);transition:width .15s}
.ghpt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-ui);font-weight:400;font-size:15px;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;font-variant-numeric:tabular-nums}
.gs{font-family:var(--f-ui);font-size:14px;background:rgba(37,33,27,.78);color:#e8e4f6;border-radius:8px;padding:2px 8px;font-variant-numeric:tabular-nums}
.gs b{font-weight:400;font-size:16px;color:#ffd23a}
.gs.spd b{color:#8ad0ff}.gs.cdr b{color:#8af0c1}
.gskl{display:flex;gap:4px;flex-wrap:wrap}
.gskl span{display:inline-flex;align-items:center;gap:2px;background:rgba(37,33,27,.78);border-radius:999px;padding:1px 7px 1px 1px}
.gskl b{font-family:var(--f-ui);font-weight:400;font-size:13px;color:#ffd23a}
.gnum{font-family:var(--f-ui);font-size:15px;color:#25211b;background:#fff4c8;border-radius:6px;padding:2px 8px}
.gopt .gnum b{font-family:var(--f-ui);font-weight:400;color:#c8372d;font-size:18px;line-height:1.2}
.grow{display:flex;align-items:center;gap:12px;font-family:var(--f-ui);font-size:20px;font-variant-numeric:tabular-nums}
.grow .gtime{flex:1;text-align:center}
.twStrip{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;width:100%;margin:10px 0;padding:12px 16px;border-radius:14px;border:2px solid #e0567a;background:linear-gradient(180deg,#fff4f6,#ffe3ea);color:#7a1630;font-family:var(--f-ui);font-size:18px;cursor:pointer}.twStrip small{font-size:14px;color:#a04060}.twStrip.all{border-color:#3fcf8e;background:linear-gradient(180deg,#f0fff6,#d8f7e6);color:#14603a}.twStrip.all small{color:#2a8050}
.twHead{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}.twHead b{font-family:var(--f-ui);font-size:22px}.twHead span{color:var(--muted);font-size:14px}.twBar{height:10px;border-radius:6px;background:#eee4d4;overflow:hidden}.twBar i{display:block;height:100%;background:linear-gradient(90deg,#3fcf8e,#7de0b0)}
.twH{margin:12px 0 6px;font-family:var(--f-ui);font-size:17px}.note.tw.ok{border-color:#3fcf8e;background:#effcf4;color:#14603a}.note.tw.ok b,.note.tw.ok span{color:#14603a!important}.note.tw.ok small{color:#1f8a52}
@media (max-width:560px){.grow{font-size:15px;gap:6px}.grow .gtime{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.gs{font-size:12px;padding:1px 6px}.gs.spd,.gs.cdr{display:none}.gstat{gap:5px}}
@media (max-height:520px) and (orientation:landscape){.ghud{gap:3px}.grow{font-size:15px;gap:8px}.grow .gtime{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.gs{font-size:12px;padding:1px 6px}.gs.spd,.gs.cdr{display:none}.gstat{gap:5px}.potBtn{left:auto!important;right:18px;bottom:14px}.burstBtn{left:auto!important;right:90px;transform:none!important;bottom:4px}}   /* 휴대폰 가로: 위 상태칸은 작게 · 물약·궁극기 버튼은 오른쪽 아래로 (캐릭터를 가리지 않게) */
/* 게임 상단 막대를 얇게 (2026-10-27: 화면을 너무 많이 가린다는 의견) · 내용은 그대로, 크기·여백만 줄이고 배경을 옅게 */
.ghud{gap:3px;padding-top:calc(env(safe-area-inset-top,0px) + 4px);padding-bottom:6px;background:linear-gradient(rgba(243,238,224,.38) 50%,rgba(243,238,224,0))}
.grow{text-shadow:0 0 3px #fff,0 0 6px #fff,0 1px 0 #fff}   /* 배경을 옅게 해도 글자가 잘 보이게 흰 테두리 빛 */
.gtool,.gpause{width:36px!important;height:36px!important;border-radius:10px!important;font-size:16px!important}
.gxp{height:6px}
.grow{font-size:16px;gap:10px}
.ghp{height:16px;border-width:1.5px;border-radius:6px;width:min(220px,50%)}
.ghpt{font-size:12px}
.gs{font-size:12px;padding:1px 6px;border-radius:6px}
.gs b{font-size:13px}
.gstat{gap:5px}
.gskl span{padding:0 5px 0 0}
.gskl b{font-size:11px}
.gskl img,.gskl svg,.gskl .ico{width:18px!important;height:18px!important}
.gtool{pointer-events:auto;width:48px;height:48px;border-radius:12px;border:2px solid #f6c544;background:#2a2347;color:#fff;font-size:20px;margin-right:6px}
.gtoolbox{pointer-events:auto;position:absolute;right:10px;top:118px;z-index:30;display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:14px;background:rgba(30,26,52,.92);border:2px solid #f6c544;box-shadow:0 6px 20px rgba(0,0,0,.35);max-height:calc(100vh - 140px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.gtoolbox::-webkit-scrollbar{width:8px}.gtoolbox::-webkit-scrollbar-thumb{background:#f6c544;border-radius:4px}
.gtoolbox button{font-family:var(--f-ui);font-size:15px;padding:8px 12px;border-radius:10px;border:0;background:#fffdf6;color:#25211b;text-align:left;min-width:170px}
.tbg{margin:0 0 6px;border:1px solid rgba(246,197,68,.45);border-radius:10px;background:rgba(255,255,255,.04);padding:2px 6px 4px}.tbg>summary{cursor:pointer;color:#ffd36a;font-weight:700;font-size:14px;padding:6px 2px;list-style:none}.tbg>summary::-webkit-details-marker{display:none}.tbg>summary::before{content:"▸ ";display:inline-block;transition:transform .15s}.tbg[open]>summary::before{transform:rotate(90deg)}.tbg>button{margin-top:4px}.tbjump{position:sticky;top:-10px;z-index:2;display:flex;gap:6px;margin:-10px -10px 4px;padding:8px 10px;background:rgba(30,26,52,.97);border-bottom:1px solid #f6c544}.tbjump button{min-width:0!important;flex:1;text-align:center!important;background:#f6c544!important;font-weight:700}
.gtoolbox small{color:#d8cfbb;font-size:11px;text-align:center}
.gpause{pointer-events:auto;width:48px;height:48px;border-radius:12px;border:2px solid #d8cfbb;background:#fffdf6;color:#25211b;font-family:var(--f-ui);font-size:18px}
.gbanner{align-self:center;margin-top:8px;background:#25211b;color:#fffdf6;border-radius:999px;padding:8px 18px;font-family:var(--f-ui);font-size:19px;text-align:center;max-width:100%}
.gmodal{position:absolute;inset:0;background:rgba(37,33,27,.55);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.gcard.origin{background:radial-gradient(circle at 50% 0%,#4a2a08,#1a1028 70%);color:#fff4d6;border:3px solid #ffd36a;box-shadow:0 0 40px rgba(255,200,80,.55)}
.gcard.origin h3{color:#ffd36a}.gcard.origin p{color:#fff4d6!important}.gcard.origin .gq{color:#fff}
.gcard.origin h3,.gcard.origin .oriHead{font-family:var(--f-hz);font-weight:900;text-shadow:0 0 14px rgba(255,190,80,.6),0 2px 0 #2a1408}
.gcard.origin h3{background:linear-gradient(#fffbe8,#ffe39a 45%,#e8b54a 55%,#b8802a);-webkit-background-clip:text;background-clip:text;color:transparent!important;font-size:30px;letter-spacing:.06em;text-shadow:none;filter:drop-shadow(0 0 10px rgba(255,190,80,.55)) drop-shadow(0 2px 0 #2a1408)}
/* 직업별 4차·오리진 글씨체 (필요한 글자만 담은 가벼운 파일) */
@font-face{font-family:"HF-warrior";src:url("hf_warrior.woff2") format("woff2");font-display:swap}
@font-face{font-family:"HF-archer";src:url("hf_archer.woff2") format("woff2");font-display:swap}
@font-face{font-family:"HF-thief";src:url("hf_thief.woff2") format("woff2");font-display:swap}
@font-face{font-family:"HF-mage";src:url("hf_mage.woff2") format("woff2");font-display:swap}
@font-face{font-family:"HF-pirate";src:url("hf_pirate.woff2") format("woff2");font-display:swap}
@font-face{font-family:"HF-healer";src:url("hf_healer.woff2") format("woff2");font-display:swap}
@font-face{font-family:"HF-calli";src:url("hf_calli.woff2") format("woff2");font-display:swap}
@font-face{font-family:"HF-zodiac";src:url("hf_zodiac.woff2") format("woff2");font-display:swap}
@font-face{font-family:"HF-mech";src:url("hf_mech.woff2") format("woff2");font-display:swap}
.oriHead{font-family:var(--f-ui);letter-spacing:.3em;font-size:14px;color:#ffd36a;animation:gwp 1s ease-in-out infinite}
@keyframes gwp{50%{opacity:.5}}
.gcard{background:#fffdf6;color:#25211b;border-radius:20px;padding:20px;width:min(100%,640px);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;text-align:center}
.gcard h3{font-family:var(--f-title);font-size:28px}
.gcard p{margin:0;color:#6b6457}
.gopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.gopts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.gopts.one{grid-template-columns:minmax(0,280px);justify-content:center}
.gopt{border:3px solid #e2dccd;background:#f6f3ea;color:#25211b;border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;gap:4px;align-items:center}
.gopt b{font-family:var(--f-hz);font-weight:900;font-size:56px;line-height:1.1}
.gopt .gh{font-family:var(--f-ui);font-size:21px;color:#c8372d}
.gopt .gn{font-family:var(--f-ui);font-size:17px}
.gopt .gn em{font-style:normal;background:#2f6b55;color:#fff;border-radius:6px;padding:0 6px;font-size:13px}
.gopt .gd{font-size:13px;color:#6b6457;line-height:1.35}
.gq{font-family:var(--f-hz);font-weight:900;font-size:110px;line-height:1.1}
.gans{border:3px solid #e2dccd;background:#f6f3ea;color:#25211b;border-radius:14px;min-height:70px;font-family:var(--f-ui);font-size:23px}
.gans.ok{background:#2f6b55;border-color:#2f6b55;color:#fff}.gans.no{background:#f6dcd7;border-color:#c8372d;color:#c8372d}
.gres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gres div{background:#f6f3ea;border-radius:14px;padding:10px;display:flex;flex-direction:column}
.gres b{font-family:var(--f-ui);font-weight:400;font-size:34px;font-variant-numeric:tabular-nums}
.gres span{font-size:13px;color:#6b6457}
.gbest{color:#c8372d!important;font-family:var(--f-ui);font-size:21px}
.gskills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.gskills span{background:#f6f3ea;border-radius:999px;padding:2px 10px;font-size:14px}
.gskills b{font-family:var(--f-hz);font-size:18px;margin-right:4px}
.gbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.game .big.alt{background:#fffdf6;color:#25211b;border-color:#e2dccd}

@media (max-width:700px){
  .qwrap{grid-template-columns:1fr}.qcard{min-height:0;padding:20px}
  .qbig{font-size:100px}
}
@media (max-width:560px){
  .bigBtns{grid-template-columns:1fr}.menu4{grid-template-columns:repeat(2,minmax(0,1fr))}.acts{grid-template-columns:1fr}
  .seg{grid-template-columns:repeat(3,minmax(0,1fr))}
  .gopts{grid-template-columns:1fr}.gopts.two{grid-template-columns:1fr 1fr}
  .gopt{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;row-gap:2px;text-align:left;align-items:center}
  .gopt .skic{grid-row:1/span 2;width:48px;height:48px}
  .reward{min-width:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01s!important}}

/* ===== 맵 잠금 쇠사슬 · 자물쇠 ===== */
.mapc{position:relative}
.mapc.chained{filter:saturate(.35) brightness(.8)}
.mchain{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit;z-index:3}
.mchain .c1,.mchain .c2{position:absolute;left:-12%;top:50%;width:124%;height:16px;margin-top:-8px;
  background:repeating-linear-gradient(90deg,#3a3a44 0 6px,#9aa0ae 6px 9px,#d8dce6 9px 13px,#7a7f8c 13px 18px,#3a3a44 18px 22px);
  border-radius:8px;box-shadow:0 3px 6px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.35);transition:transform 1s cubic-bezier(.5,0,.8,.4),opacity 1s}
.mchain .c1{transform:rotate(28deg)}.mchain .c2{transform:rotate(-28deg)}
.plock{position:absolute;left:50%;top:50%;width:46px;height:54px;margin:-24px 0 0 -23px;transition:transform .9s cubic-bezier(.5,0,.8,.4),opacity .9s}
.plock .shk{position:absolute;left:9px;top:0;width:28px;height:26px;border:6px solid #b8bcc8;border-bottom:none;border-radius:16px 16px 0 0;box-shadow:inset 0 2px 0 #fff8;transition:transform .35s}
.plock .bod{position:absolute;left:0;top:20px;width:46px;height:34px;border-radius:7px;background:linear-gradient(#ffe08a,#d4a23a 55%,#8a5e1a);box-shadow:0 4px 8px rgba(0,0,0,.6),inset 0 2px 0 #fff8}
.plock .bod::after{content:"";position:absolute;left:19px;top:9px;width:8px;height:14px;border-radius:4px 4px 2px 2px;background:#3a2408}
.mchain.go .plock{animation:lockshake .35s 2}
.mchain.go .plock .shk{transform:translateY(-12px) rotate(-18deg);transition-delay:.7s}
.mchain.go .plock{transform:translateY(160px) rotate(40deg);opacity:0;transition-delay:1s}
.mchain.go .c1{transform:rotate(28deg) translate(-130%,40px);opacity:0;transition-delay:1.05s}
.mchain.go .c2{transform:rotate(-28deg) translate(130%,40px);opacity:0;transition-delay:1.05s}
@keyframes lockshake{25%{margin-left:-27px}75%{margin-left:-19px}}
.unlockToast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:9999;background:radial-gradient(circle,#4a3010,#1a1028);color:#fff4d6;border:3px solid #ffd36a;border-radius:18px;padding:18px 28px;font-family:var(--f-title);font-size:28px;display:flex;align-items:center;gap:14px;box-shadow:0 0 40px rgba(255,200,80,.6);animation:utoast 3.2s ease forwards}
.unlockToast img{width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 0 10px #ffd36a)}.unlockToast b{color:#ffd36a}
@keyframes utoast{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}10%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}18%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
/* ===== 결과 화면 보물상자 ===== */
.gchest{display:flex;flex-direction:column;align-items:center;gap:6px}
.chestbox{position:relative;width:92px;height:70px}
.chestbox .box{position:absolute;left:0;bottom:0;width:92px;height:44px;border-radius:6px;background:linear-gradient(#a8692a,#6a3a12);border:3px solid #ffd36a;box-sizing:border-box}
.chestbox .lid{position:absolute;left:0;top:4px;width:92px;height:26px;border-radius:30px 30px 4px 4px;background:linear-gradient(#c8853a,#8a4e1a);border:3px solid #ffd36a;box-sizing:border-box;transform-origin:10% 100%;animation:lidopen .6s .5s ease forwards}
.chestbox .glow{position:absolute;left:46px;top:30px;width:0;height:0;border-radius:50%;box-shadow:0 0 30px 18px rgba(255,220,120,0);animation:cglow 1s .7s ease forwards}
@keyframes lidopen{to{transform:rotate(-38deg) translateY(-6px)}}
@keyframes cglow{to{box-shadow:0 0 50px 30px rgba(255,220,120,.85)}}
.chestimg{position:relative;width:150px;height:120px}
.chestimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.chestimg .cc{animation:cshake .5s .2s ease-in-out 2, chide .01s 1.15s forwards}
.chestimg .co{opacity:0;animation:cshow .25s 1.15s ease-out forwards}
.chestimg .glow{position:absolute;left:50%;top:45%;width:0;height:0;border-radius:50%;box-shadow:0 0 40px 22px rgba(255,220,120,0);animation:cglow 1s 1.15s ease forwards}
          .chestimg+.chestout{animation-delay:1.35s}
@keyframes cshake{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes chide{to{opacity:0}}
@keyframes cshow{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.chestout{opacity:0;animation:cout .7s 1s ease forwards;text-align:center}
.chestout .ckey{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 0 12px #ffd36a);animation:kfloat 2.4s 1.7s ease-in-out infinite}
@keyframes cout{from{opacity:0;transform:translateY(30px) scale(.6)}to{opacity:1;transform:none}}
@keyframes kfloat{50%{transform:translateY(-6px) rotate(4deg)}}

function hanjaWeight(c){ const m=(P.mastery||{})[c.h]||0, wc=(P.wcnt||{})[c.h]||0, inW=(P.wrong||[]).includes(c.h);
  return 1 + Math.min(6,wc)*1.2 + (inW?3:0) + Math.max(0,MASTER_N-m)*0.9 + ((P.seen||{})[c.h]?0:1.2) }
function pickWeighted(list,n){ const out=[]; let pool=list.slice();
  while(out.length<n && list.length){ if(!pool.length) pool=list.slice();
    const ws=pool.map(hanjaWeight), tot=ws.reduce((a,b)=>a+b,0); let r=Math.random()*tot, k=0; while(r>ws[k]&&k<ws.length-1){ r-=ws[k]; k++ }
    out.push(pool[k]); pool.splice(k,1) } return out }

/* 학습 보상: 하루 DAILY_SETS 세트까지 */
/* 높은 주차일수록 코인을 더 많이: 고른 주차 평균이 1주차면 ×1.0, 26주차면 ×2.0 */
/* 많은 주차를 함께 고를수록 + 높은 주차까지 고를수록 코인이 늘어요 (1~26주차 전체 ×3) */
function weekMul(){ const sel=(P&&P.set&&P.set.sel)||[]; if(!sel.length) return 1; const mx=Math.max(...sel); return Math.min(3.5,Math.round((1+.8*(Math.min(mx,S1_N)-1)/25+(mx>S1_N?.3:0)+1.2*(sel.length-1)/25)*10)/10) }   /* 시즌 2를 섞으면 조금 더 · 최대 ×3.5 */
/* 코인 벌기: 하루 한도(DAILY_COIN_MAX)까지만 들어가요. 실제로 들어간 코인을 돌려줘요 */
function coinLeft(){ if(isAdmin()) return 1e9; const d=day(); return Math.max(0,DAILY_COIN_MAX-(d.coin||0)) }
const COIN_BOOST = 1.5;   /* 2개월 일정: 버는 코인 1.5배 (하루 한도 1000은 그대로) */
function earn(n){ n=Math.max(0,Math.round((n||0)*COIN_BOOST)); if(!n||!P) return 0; const d=day(); const a=Math.min(n,coinLeft()); d.coin=(d.coin||0)+a; P.coins+=a; P.earned+=a; saveP(); return a }
function capNote(){ return coinLeft()<=0?`오늘 코인 한도 ${DAILY_COIN_MAX}개를 다 채웠어요. 공부와 게임은 계속 할 수 있어요!`:"" }
function grantSet(amount,raw,final,count){
  if(!raw&&!final) amount=amount*weekMul();
  const d=day(); P.stats.sets++;
  if(!(amount>0)){ if(count) d.sets++; saveP(); return {got:0,stair:stairMul(d.sets),zero:true,counted:!!count,capped:false,limited:false,exp:0} }   /* 경험치도 코인과 같은 기준 (2026-10-27): 코인이 없으면 경험치도 없어요 */   /* count: 코인은 없어도 오늘 공부 세트로는 쳐요 (만점이 아니어도 60% 이상) */   /* 맞힌 게 없으면(모르겠어요만 누름) 코인·경험치 없음 (2026-10-26) */
  if(!final) amount=Math.max(1,Math.round(amount*(d.sets>=DAILY_SETS?STAIR[STAIR.length-1]:stairMul(d.sets))));
  if(d.sets>=DAILY_SETS){ saveP(); return {got:0,limited:true,exp:addExp(Math.round(amount*0.75))} }
  const st=stairMul(d.sets); d.sets++; const got=earn(amount); saveP();
  return {stair:st,got,capped:got<amount,limited:false,exp:addExp(Math.round(amount*1.5*(1+titleFx("xpS"))))};
}

let KO_V=null; function koVoice(){ if(!canSpeak) return null; if(KO_V) return KO_V; const vs=speechSynthesis.getVoices()||[], ko=vs.filter(v=>/^ko/i.test(v.lang||"")); KO_V=ko.find(v=>/Google|Natural|Online|Neural|Heami|SunHi|InJoon|Yuna/i.test(v.name))||ko[0]||null; return KO_V }

function todayHanja(){ const sel=(P.set.sel&&P.set.sel.length)?Math.max(...P.set.sel):5, pool=[...new Map(WEEKS.slice(0,Math.max(3,sel)).flat().map(c=>[c.h,c])).values()];
  let seed=0; for(const ch of todayKey()+curId) seed=(seed*31+ch.charCodeAt(0))>>>0;
  const ws=pool.map(hanjaWeight), tot=ws.reduce((a,b)=>a+b,0); let r=(seed%10000)/10000*tot, k=0; while(r>ws[k]&&k<ws.length-1){ r-=ws[k]; k++ } return pool[k] }
function todayHtml(){ const c=todayHanja(), done=P.daily&&P.daily.todayHz===todayKey(), W=wordsOf(c.h);

    {t:"게임 시작하기", n:2, art:`<div style="display:flex;flex-direction:column;gap:12px;align-items:center;width:100%"><div class="gdFlow"><div class="gdStep">${ico("coin")}입장료 ${GAME_COST}코인</div><div class="gdStep"><span style="font-size:36px">🎮</span>하루 ${DAILY_PLAYS}판</div></div><div class="gdMaps">${MAPS.map((m,k)=>`<span style="background:${MAPC[k]}">${m.name}<br><small>${m.diff}</small></span>`).join("")}</div></div>`,

    {t:"📚 모르면 어려워요! ① 익힌 것", n:2, art:`<div class="gdIcons"><div><span class="em">📖</span><b>한자</b><span class="gdD">그 한자 문제를 <b>6번</b> 맞히기</span></div><div><span class="em">📜</span><b>사자성어·속담</b><span class="gdD"><b>4번</b> 맞히기 + 생활 문제 <b>3번</b></span></div><div><span class="em">✍</span><b>기억해서 쓰기</b><span class="gdD">한 번에 <b>2번</b>으로 쳐요</span></div></div>`,

    {t:"③ 틀리면 어떻게 돼요?", n:2, art:`<div class="gdIcons"><div><span class="em">🃏</span><b>레벨 업 카드</b><span class="gdD">문제 기회 <b>2번</b></span></div><div><span class="em">😵</span><b>혼란</b><span class="gdD">틀리면 잠깐 약해져요</span></div><div><span class="em">📉</span><b>정답률</b><span class="gdD"><b>80%</b> 넘어야 보상 전부</span></div></div>`,

    {t:"중간에 그만두면?", n:2, art:`<div class="gdIcons"><div><span class="em">⏱</span><b>1분 안에 나가면</b><span class="gdD">판 수·입장료 <b>그대로</b></span></div><div><span class="em">🚪</span><b>1분 넘게 하고 그만하기</b><span class="gdD"><b>한 만큼</b> 보상</span></div><div><span class="em">📱</span><b>창을 닫아도</b><span class="gdD">다음에 켜면 <b>받아요</b></span></div></div>`,

     x:`보스 4마리를 순서대로 물리치면 <b>스테이지 클리어!</b><br><b>약한 보스 → 중간 보스 → 강한 보스 → 최종 보스</b> · 보스를 잡을 때마다 맵이 바뀌고 몬스터가 강해져요. (보스가 오기 10초 전에 알려 줘요)`, tip:"용암·회오리·대포처럼 맵마다 위험한 것이 달라요. 빨간 원과 화살표 신호를 잘 봐요!"},
    {t:"오리진 스킬 (위기 탈출!)", n:2, art:`<div class="gdFlow"><div class="gdStep" style="min-width:0;flex:1;padding:10px 6px;font-size:16px"><span style="font-size:36px">🆘</span>체력이 낮고<br>몬스터가 가득!</div><div class="gdStep" style="min-width:0;flex:1;padding:10px 6px;font-size:16px"><span style="font-size:36px">📜</span>한자 문제<br><b style="color:#ffd36a;font-weight:400">2개 다 맞히기</b></div><div class="gdStep" style="min-width:0;flex:1;padding:10px 6px;font-size:16px"><span style="font-size:36px">✨</span><b style="color:#ffd36a;font-weight:400">오리진 발동!</b><br>화면 몬스터 싹쓸이</div></div>`,
     x:`아주 위험할 때 <b>오리진 스킬</b> 기회가 와요! 한자 2문제를 <b>모두</b> 맞히면 화면의 몬스터가 한꺼번에 사라지고 체력이 <b>40%</b> 차요. (보스는 체력이 크게 깎여요)<br><b>같이 하기</b>에서는 <b>모든 친구가</b> 2문제를 다 맞혀야 발동해요!`, tip:"한 번 쓰면 잠시 뒤에 다시 기회가 와요. 평소에 한자를 잘 외워 두면 위기에서 살아남아요!"},
    {t:"보스의 기술과 필살기", n:2, art:`<div class="gdFlow"><div class="gdStep" style="min-width:0;flex:1;padding:10px 6px;font-size:16px"><span style="font-size:36px">✨</span>보스가 빛나며<br><b style="color:#ffd36a;font-weight:400">기를 모으면</b></div><div class="gdStep" style="min-width:0;flex:1;padding:10px 6px;font-size:16px"><span style="font-size:36px">💥</span>곧 <b style="color:#ffd36a;font-weight:400">기술</b>이 나와요<br>빨간 원·선을 피해요</div><div class="gdStep" style="min-width:0;flex:1;padding:10px 6px;font-size:16px"><span style="font-size:36px">☠️</span>최종 보스는 체력 절반에<br><b style="color:#ffd36a;font-weight:400">필살기!</b></div></div>`,

    {t:"보스가 더 똑똑해졌어요!", n:2, art:`<div class="gdIcons"><div><span class="em">🌀</span><b>순간이동</b><span class="gdD">보스가 화면 밖으로 멀어지면 보라색 원 자리로 날아와요</span></div><div><span class="em">👥</span><b>부하 소환</b><span class="gdD">보라 테두리 부하를 다 잡으면 보스가 2초 기절!</span></div><div><span class="em">🟥</span><b>빨간 띠 돌진</b><span class="gdD">띠 폭이 보스 몸 크기예요. 띠 밖으로 피해요</span></div><div><span class="em">🐝</span><b>따라오는 공격</b><span class="gdD">벌·박쥐·불덩이는 2.5초 동안 따라와요. 크게 돌며 피해요</span></div><div><span class="em">🕳</span><b>사건의 지평선</b><span class="gdD">내 발밑에 블랙홀! 바깥으로 걷고 마지막 폭발을 피해요</span></div><div><span class="em">🔥</span><b>더 센 곳</b><span class="gdD">마왕성·별의 왕좌, 어려움·지옥, 친구가 많을수록 패턴이 많아요</span></div></div>`,

    {t:"오답 노트 활용하기", art:`<div class="gdIcons"><div><span class="em">⚔</span><b>복수전</b><span class="gdD">틀린 문제가 게임에 다시! 맞히면 공격력 <b>+15%</b></span></div><div><span class="em">📝</span><b>출전 전 복습</b><span class="gdD"><b>3문제</b> 다 맞히면 보너스</span></div><div><span class="em">🪙</span><b>오답 퀴즈</b><span class="gdD">코인 <b>×1.3</b></span></div><div><span class="em">🏅</span><b>극복</b><span class="gdD"><b>3번 연속</b> 맞히면 코인</span></div></div>`,

    {t:"게임으로 코인 벌기", n:2, art:`<div class="gdIcons" style="grid-template-columns:repeat(4,minmax(0,1fr))">${MAPS.map((m,k)=>`<div style="border-color:${MAPC[k]||"#8ad8ff"}"><span class="em">${["🌼","🌲","🏛️","🦇","🔥","🌪","🏰","❄","⚡","🌌"][k]||"☁"}</span><b>${m.name}</b>★4 클리어<br><span style="color:#ffd36a">최대 ${maxGameCoins(m.id)}</span><br>첫 클리어 +${firstClearCoin(m.id)}</div>`).join("")}</div>`,

function HS(id){ id=id||P.hero; P.hl=P.hl||{}; if(!P.hl[id]) P.hl[id]={lv:1,exp:0,pts:0,hp:0,atk:0,spd:0,dmg:0,tier:0,v3:1}; const s=P.hl[id]; if(!s.v3){ s.pts=(s.pts||0)*3; s.hp=(s.hp||0)*3; s.atk=(s.atk||0)*3; s.spd=(s.spd||0)*3; s.v3=1 }
  if(!s.v4&&typeof STAT!=="undefined"){ s.v4=1; const K=["hp","atk","dmg","spd","bd","ied"], used=K.reduce((a,k)=>a+(s[k]||0),0), legit=Math.max(0,((s.lv||1)-1)*STAT.ppl); if(used+(s.pts||0)>legit+2){ for(const k of K) s[k]=0; s.pts=legit; if(typeof statAuto==="function"){ try{ s.pts-=statAuto(id,s,"1-0",s.pts) }catch(e){} } } }   /* 추천 찍기 오류로 늘어난 포인트를 바로잡아요 (레벨 × 3포인트로) */
  if(typeof STAT!=="undefined"){ const used=["hp","atk","dmg","spd","bd","ied"].reduce((a,k)=>a+(s[k]||0),0), legit=Math.max(0,((s.lv||1)-1)*STAT.ppl); if(used+(s.pts||0)<legit) s.pts=legit-used }   /* 고침 (2026-10-27): 레벨에 비해 포인트가 모자라면(선생님 모드에서 레벨 150인데 0포인트 등) 모자란 만큼 채워요 · 레벨 × 3포인트를 넘지는 않아요 */
  return s }   /* 레벨마다 3포인트로 바뀌었어요: 이전 포인트는 3배로 (세기는 그대로) */
const jobTitle = id=>JOBS[id].titles[HS(id).tier];
/* 5차 각성 조건: Lv 120 + 그 용사로 별의 왕좌 어려움 이상 클리어 + 익힌 한자 100자 */
const AWK_MASTER=100;
const awakeReq = id=>{ const hon=((P.honor||{})[id]||0)>=2, m=UNIQUE.filter(c=>(P.mastery[c.h]||0)>=MASTER_N).length; return {hon, m, ok:isAdmin()||(hon&&m>=AWK_MASTER)} };
const canAdvance = id=>{ const s=HS(id); if(s.tier>=5||s.lv<JOB_LV[s.tier]) return false; return s.tier<4||awakeReq(id).ok };
function addExp(n){
  if(!P||!(n>0)) return 0;
  const s=HS(); if(s.lv>=MAX_LV) return 0;
  n=Math.max(1,Math.round(n*HERO_EXP_RATE*((heroById(P.hero).perks||{}).xp||1))); s.exp+=n; let ups=0;
  while(s.lv<MAX_LV && s.exp>=expNeed(s.lv)){ s.exp-=expNeed(s.lv); s.lv++; s.pts+=STAT.ppl; ups++ }
  if(s.lv>=MAX_LV) s.exp=0;
  saveP();
  if(ups) setTimeout(()=>{ sfx("lvup"); stamp("레벨<br>업!"); toast(`${heroById(P.hero).name} 레벨 업! Lv ${s.lv} · 능력치 포인트 +${ups*STAT.ppl}${canAdvance(P.hero)?" · 전직할 수 있어요!":""}`) },500);
  return n;
}

/* 스킬 미리보기 영상은 용사 성장 화면을 처음 열 때만 불러와요 (첫 화면을 빠르게) */

/* 용사 그림 가운데 맞추기: 그림마다 캐릭터가 한쪽으로 치우쳐 있어서, 보이는 부분의 가운데로 옮겨요 */
const ART_CX={};
function centerArt(img){ const go=()=>{ const k=img.src; let dx=ART_CX[k]; if(dx===undefined){ try{ const N=64, c=document.createElement("canvas"); c.width=N; c.height=N; const x=c.getContext("2d"); x.drawImage(img,0,0,N,N); const d=x.getImageData(0,0,N,N).data; let l=N, r=-1;
      for(let yy=0;yy<N;yy++) for(let xx=0;xx<N;xx++) if(d[(yy*N+xx)*4+3]>40){ if(xx<l) l=xx; if(xx>r) r=xx } dx=r<0?0:(N/2-(l+r+1)/2)/N*100 }catch(e){ dx=0 } ART_CX[k]=dx } img.style.transform=`translateX(${dx}%)` }; if(img.complete&&img.naturalWidth) go(); else img.addEventListener("load",go,{once:true}) }
new MutationObserver(ms=>{ if(document.querySelector(".game")) return; document.querySelectorAll(".gpic img:not([data-ctr])").forEach(i=>{ i.dataset.ctr=1; centerArt(i) }) }).observe(document.documentElement,{childList:true,subtree:true});   /* 게임 중엔 건너뛰어요 (렉 줄이기) */
function grow(id,back){

function makeQ(c,opt){ opt=opt||{}; if(c&&c.cat&&typeof makeSayQ==="function") return makeSayQ(c,opt);
  let others=shuffle(UNIQUE.filter(x=>x.h!==c.h));
  if(opt.hard){ const sim=o=>(o.eum===c.eum?3:0)+(o.eum&&c.eum&&o.eum[0]===c.eum[0]?1:0)+([...(o.hun||"")].some(ch=>(c.hun||"").includes(ch))?2:0); others=others.map(o=>[o,sim(o)+Math.random()]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]) }   /* 어려운 문제: 소리·뜻이 비슷한 보기부터 */
  const pick=key=>{const seen=new Set([key(c)]),out=[];for(const o of others){const k=key(o);if(!seen.has(k)){seen.add(k);out.push(o)}if(out.length===3)break}return shuffle([c,...out])};
  const W=typeof wordsOf==="function"?wordsOf(c.h):[];
  const types=opt.hard?["toh","he","hun"]:["he","toh","eum","hun"]; if(W.length){ types.push("inword"); if(!opt.short) types.push("word"); if(opt.hard) types.push("word","inword") }
  const t=types[Math.random()*types.length|0];
  if(t==="inword"){ const w=W[Math.random()*W.length|0], wrong=shuffle(others.flatMap(o=>wordsOf(o.h)).filter(x=>!x[0].includes(c.h))).slice(0,3);
    return {c,tag:"낱말 찾기",big:null,q:`'${label(c)}'이 들어간 낱말은?`,opts:shuffle([w,...wrong]).map(x=>({text:x[0],hz:true,rd:x[1],ok:x===w})),word:w} }
  if(t==="word"){ const w=W[Math.random()*W.length|0], wrong=shuffle(others.flatMap(o=>wordsOf(o.h)).filter(x=>x[2]!==w[2])).slice(0,3);
    return {c,tag:"낱말 뜻",big:w[0],q:`'${w[1]}'(${w[0]})의 뜻은?`,opts:shuffle([w,...wrong]).map(x=>({text:x[2].replace(/ \(.+\)$/,""),ok:x===w})),word:w} }
  if(t==="he")  return {c,tag:"뜻과 소리",big:c.h,q:"이 한자의 뜻과 소리는?",opts:pick(label).map(o=>({text:label(o),ok:o.h===c.h}))};
  if(t==="toh") return {c,tag:"한자 찾기",big:null,q:`'${label(c)}'에 알맞은 한자는?`,opts:pick(label).map(o=>({text:o.h,hz:true,ok:o.h===c.h}))};
  if(t==="eum") return {c,tag:"소리(음)",big:c.h,q:"이 한자는 어떻게 읽을까요?",opts:pick(o=>o.eum).map(o=>({text:o.eum,ok:o.eum===c.eum}))};
  return {c,tag:"뜻(훈)",big:c.h,q:"이 한자의 뜻은?",opts:pick(o=>o.hun).map(o=>({text:o.hun,ok:o.hun===c.hun}))};
}

    <div class="btns" id="after" hidden><button class="btn ghost" id="again">한 번 더</button><button class="btn ghost" id="mm">메인으로</button></div>`);
  document.getElementById("take").onclick=e=>{e.currentTarget.hidden=true;document.getElementById("after").hidden=false;if(r.got){sfx("coin");countUp(P.coins-r.got,P.coins)}};
  document.getElementById("again").onclick=()=>{modal.dataset.dismiss="";closeModal();again()};
  document.getElementById("mm").onclick=()=>{modal.dataset.dismiss="";closeModal();home()};
}

/* ===== 카드 ===== */
function cards(list,{fromNotes=false}={}){
  let order=[...list], i=0; const seen=new Set();
  function draw(){
    const c=order[i]; markSeen(c.h);
    $app.innerHTML = topbar(fromNotes?"오답 카드":"학습 · 한자 카드") + `
    <div class="prog"><div class="pt"><span>뒤집어 본 카드 ${seen.size} / ${order.length}</span><b>${i+1} / ${order.length}</b></div><div class="bar"><i style="width:${(i+1)/order.length*100}%"></i></div></div>
    <button class="flip" id="flip" aria-label="카드 뒤집기"><div class="in">
      <div class="face"><span class="wtag">${c.w}주차</span><div class="h">${esc(c.h)}</div><div class="hint">눌러서 뜻과 소리 보기</div></div>
      <div class="face bk"><span class="wtag">${c.w}주차</span><div class="sm">${esc(c.h)}</div><div class="hun">${esc(c.hun)} <em>${esc(c.eum)}</em></div>${wordsOf(c.h).length?`<div class="cwords">${wordsOf(c.h).map(w=>`<span><b>${esc(w[0])}</b> ${esc(w[1])}<small>${esc(w[2])}</small></span>`).join("")}</div>`:""}</div>
    </div></button>
    <div class="btns">
      <button class="btn ghost" id="prev" ${i?"":"disabled"}>◀ 이전</button>
      <button class="btn ghost" id="stk">획순 보기</button>
      ${canSpeak?`<button class="btn ghost" id="say">소리 듣기</button>`:""}
      <button class="btn red" id="hard">헷갈려요</button>
      <button class="btn jade" id="know">알아요 ▶</button>
    </div>`;
    bindBack();
    const f=document.getElementById("flip");
    f.onclick=()=>{f.classList.toggle("on");seen.add(c.h);sfx("flip")};
    document.getElementById("prev").onclick=()=>{i--;draw()};
    document.getElementById("stk").onclick=()=>openStroke(c);
    if(canSpeak) document.getElementById("say").onclick=()=>{const v=P.set.voice;P.set.voice=true;speak(label(c));P.set.voice=v};
    document.getElementById("hard").onclick=()=>{addWrong(c.h);next()};
    document.getElementById("know").onclick=()=>{if(fromNotes)delWrong(c.h);next()};
  }
  function next(){ if(i<order.length-1){i++;draw()} else finish() }
  function finish(){
    const all=order.every(c=>seen.has(c.h));
    /* 카드 보기는 복습용이라 코인은 없어요. 퀴즈로 확인하면 코인을 받아요 */
    modal.dataset.dismiss="";
    openModal(`<h3>카드를 다 봤어요!</h3><p>${all?"":"아직 뒤집지 않은 카드도 있어요. "}이제 <b>퀴즈</b>로 정말 외웠는지 확인해 볼까요? 퀴즈를 풀면 코인을 받아요.</p>
    <div class="btns"><button class="btn gold" id="qz">퀴즈로 확인하기</button><button class="btn ghost" id="again">카드 다시 보기</button><button class="btn ghost" id="mm">메인으로</button></div>`);
    document.getElementById("qz").onclick=()=>{closeModal();quiz(list,{fromNotes})};
    document.getElementById("again").onclick=()=>{closeModal();cards(list,{fromNotes})};
    document.getElementById("mm").onclick=()=>{closeModal();home()};
  }
  draw();
}

/* ===== 낱말 만들기: 뜻과 읽기를 보고 한자 조각을 순서대로 골라 낱말을 완성해요 ===== */
const BUILD_N = 5, BUILD_MAX = 5*3+5;   // 한 번에 막힘없이 만들면 3, 다 끝내면 +5
function buildWords(list){
  const tasks=pickWeighted(list.filter(c=>wordsOf(c.h).length),BUILD_N).map(c=>{ const W=wordsOf(c.h); return {c,w:W[Math.random()*W.length|0]} });
  if(!tasks.length){ toast("이 주차에는 낱말이 없어요"); return }
  let i=0, score=0, clean=0, miss=[];
  function draw(){
    const {c,w}=tasks[i], chars=[...w[0]], rd=[...w[1].replace(/\s/g,"")], same=rd.length===chars.length;
    /* 2026-10-27: 고른 주차의 한자(와 이미 익힌 한자)만 직접 골라요. 안 배운 한자는 미리 채워 둬요 */
    const KN=new Set([...list.map(x=>x.h), ...Object.keys(P.mastery||{}).filter(h=>(P.mastery[h]||0)>=MASTER_N)]); KN.add(c.h);
    const given=chars.map(h=>!KN.has(h)), need=chars.map((h,k)=>k).filter(k=>!given[k]);
    const nN=need.length, dpool=UNIQUE.filter(o=>!chars.includes(o.h) && !rd.includes(o.eum)), dl=dpool.filter(o=>KN.has(o.h));
    const dis=[...shuffle(dl), ...shuffle(dpool.filter(o=>!KN.has(o.h)))].slice(0,Math.max(3,6-nN));   // 방해 조각도 아는 한자에서 먼저
    const tiles=shuffle([...need.map(k=>({h:chars[k],k})), ...dis.map(o=>({h:o.h,k:-1}))]);
    let pi=0, mistakes=0, hint=false;
    $app.innerHTML = topbar("학습 · 낱말 만들기") + `
    <div class="prog"><div class="pt"><span>완성한 낱말 ${i} / ${tasks.length}</span><b>${i+1} / ${tasks.length}</b></div><div class="bar"><i style="width:${i/tasks.length*100}%"></i></div></div>
    <div class="bwCard">
      <div class="bwTag">${c.w}주차 · '${esc(label(c))}'이 들어간 낱말</div>
      <div class="bwMean">“${esc(w[2])}”</div>
      <div class="bwRead">읽기: <b>${esc(w[1])}</b></div>
      <div class="bwSlots">${chars.map((h,k)=>`<span class="bwSlot${given[k]?" on given":""}" data-s="${k}">${given[k]?`<b>${esc(h)}</b>`:""}${same?`<small>${esc(rd[k])}</small>`:""}</span>`).join("")}</div>
      <div class="bwMsg" id="bwMsg">소리에 맞는 한자를 <b>순서대로</b> 눌러요${given.some(x=>x)?` <small style="opacity:.75">(회색 칸은 아직 안 배운 한자라 미리 채워 뒀어요)</small>`:""}</div>
    </div>
    <div class="bwTiles">${tiles.map((t,n)=>`<button class="bwTile" data-n="${n}"><b>${esc(t.h)}</b><small class="bwEum" hidden>${esc((UNIQUE.find(o=>o.h===t.h)||{}).eum||(t.k>=0&&same?rd[t.k]:"?"))}</small></button>`).join("")}</div>
    <div class="btns"><button class="btn ghost" id="bwHint" ${P.coins<HINT_COST?"disabled":""}>힌트: 조각에 소리 보이기 ${ico("coin","ci")}-${HINT_COST}</button></div>`;
    bindBack();
    const msg=document.getElementById("bwMsg"), slots=[...$app.querySelectorAll(".bwSlot")];
    document.getElementById("bwHint").onclick=e=>{ if(P.coins<HINT_COST) return; setCoins(P.coins-HINT_COST); saveP(); sfx("tap"); hint=true; e.currentTarget.disabled=true; $app.querySelectorAll(".bwEum").forEach(x=>x.hidden=false); msg.textContent="힌트를 썼어요. 소리를 보고 골라 봐요!" };
    $app.querySelectorAll(".bwTile").forEach(b=>b.onclick=()=>{
      const t=tiles[+b.dataset.n]; if(b.disabled) return;
      const pos=need[pi]; if(pos!=null&&t.h===chars[pos]){ sfx("ok"); b.disabled=true; b.classList.add("used"); const sl=slots[pos]; sl.classList.add("on"); sl.insertAdjacentHTML("afterbegin",`<b>${esc(t.h)}</b>`); pi++;
        if(pi>=nN) done() }
      else { sfx("no"); mistakes++; b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); msg.innerHTML=mistakes>=2&&!hint?"어려우면 <b>힌트</b>를 눌러 봐요!":"그 한자가 아니에요. 소리를 다시 생각해 봐요!" } });
    function done(){
      const ok=mistakes===0&&!hint; if(ok){ score+=3; clean++ } else if(mistakes<=1) score+=1;
      trackAns(c,ok); P.stats.q++; if(ok){ P.stats.c++; P.mastery[c.h]=(P.mastery[c.h]||0)+1 } else { addWrong(c.h); miss.push(c) } markSeen(c.h); saveP();
      const parts=chars.map(h=>{ const o=UNIQUE.find(x=>x.h===h); return o?`<span><b>${esc(h)}</b> ${esc(label(o))}</span>`:`<span><b>${esc(h)}</b></span>` }).join(" + ");
      msg.innerHTML=`${ok?"완벽해요! ":"완성! "}<b>${esc(w[0])}</b>(${esc(w[1])}) = ${esc(w[2])}<div class="bwParts">${parts}</div>`;
      stamp(ok?"딱 맞아요!":"완성!"); speak(w[1]);
      $app.querySelector(".btns").innerHTML=`<button class="btn jade big" id="bwNext">${i<tasks.length-1?"다음 낱말 ▶":"결과 보기"}</button>`;
      $app.querySelectorAll(".bwTile").forEach(x=>x.disabled=true);
      document.getElementById("bwNext").onclick=()=>{ i++; i<tasks.length?draw():finish() } }
  }
  function finish(){
    const um=[...new Map(miss.map(c=>[c.h,c])).values()];
    rewardModal("낱말 만들기 완료!",`${tasks.length}개 중 <b>${clean}개</b>를 힌트 없이 한 번에 만들었어요!${um.length?`<br>다시 볼 한자: ${um.map(c=>`<b>${esc(c.h)}</b>(${esc(label(c))})`).join(", ")}`:""}${clean<tasks.length?`<p class="muted" style="color:#c8372d;font-weight:600">모두 힌트 없이 한 번에 만들어야 코인을 받아요 (${clean} / ${tasks.length})</p>`:""}`,clean>=tasks.length?score+5:0,()=>buildWords(list),clean>=tasks.length*.6);   /* 코인 막기 (2026-10-27): 모두 힌트 없이 맞혀야 코인 */
  }
  draw();
}

/* ===== 한자 비: 위에서 뜻·소리 구름이 내려와요. 땅에 닿기 전에 맞는 한자 버튼을 눌러 막아요 ===== */
const RAIN_N = 20, RAIN_LIVES = 5, RAIN_MAX = 20+3*3+6;   /* 2026-10-27: 목숨 3 → 5 · 2개까지 놓쳐도 코인 전부 */   // 막은 구름 1개당 1 · 남은 목숨 1개당 3 · 하나도 안 놓치면 +6
function hanjaRain(list){
  const uniq=[...new Map(list.map(c=>[c.h,c])).values()];
  if(uniq.length<3){ toast("한자를 3개 이상 골라 주세요"); return }
  const NB=Math.min(6,uniq.length);
  let lives=RAIN_LIVES, spawned=0, cleared=0, missed=0, wrongs=0, lockT=0, combo=0, best=0, speed=30, gap=2.6, acc=1.6, last=performance.now(), raf=0, over=false;
  const order=pickWeighted(uniq,Math.min(uniq.length,40)); let oi=0;
  const nextHz=()=>{ const c=order[oi%order.length]; oi++; return c };
  let btns=[]; while(btns.length<NB){ const c=nextHz(); if(!btns.some(b=>b.h===c.h)) btns.push(c) }
  const clouds=[]; const missList=[];
  $app.innerHTML = topbar("학습 · 한자 비") + `
    <div class="rainHud"><div class="rainShield" id="rLives"></div><div class="rainProg"><b id="rProg"></b></div><div class="rainCombo" id="rCombo"></div></div>
    <div class="rainBox" id="rainBox"><div class="stars"></div><div class="moon"></div><div class="mtn"></div><div class="fog"></div><div class="mtn b"></div><div class="town"></div><div class="rainBarrier" id="rBar"></div>
      <div class="rainMsg" id="rMsg">먹구름이 마을로 내려와요! 뜻·소리에 맞는 한자를 눌러 막아요</div></div>
    <div class="rainBtns" id="rainBtns"></div>`;
  bindBack();
  const box=document.getElementById("rainBox"), bw=document.getElementById("rainBtns"), msg=document.getElementById("rMsg");
  function drawBtns(){ bw.innerHTML=btns.map((c,i)=>`<button class="rainBtn" data-i="${i}">${esc(c.h)}</button>`).join("");
    bw.querySelectorAll(".rainBtn").forEach(b=>b.onpointerdown=e=>{ e.preventDefault(); press(+b.dataset.i,b) }) }
  drawBtns();
  function hud(){ document.getElementById("rLives").innerHTML=Array.from({length:RAIN_LIVES},(_,i)=>`<i class="${i<lives?"":"off"}"></i>`).join(""); document.getElementById("rProg").style.width=((cleared+missed)/RAIN_N*100)+"%"; document.getElementById("rCombo").textContent=combo>=3?`🔥 ${combo}연속`:`${cleared} / ${RAIN_N}` }
  function burst(k,h){ const bx=k.x+66, by=k.y+44; const b=document.createElement("div"); b.className="rainBurst"; b.textContent=h; b.style.left=bx+"px"; b.style.top=by+"px"; box.appendChild(b); setTimeout(()=>b.remove(),700);
    for(let i=0;i<12;i++){ const p=document.createElement("i"); p.className="rainSpark"; const a=i/12*Math.PI*2, d=50+Math.random()*40; p.style.left=bx+"px"; p.style.top=by+"px"; p.style.setProperty("--dx",Math.cos(a)*d+"px"); p.style.setProperty("--dy",Math.sin(a)*d+"px"); box.appendChild(p); setTimeout(()=>p.remove(),600) } }
  function spawn(){
    const active=new Set(clouds.map(k=>k.c.h)); const cand=btns.filter(b=>!active.has(b.h)); if(!cand.length) return false;
    const c=cand[Math.random()*cand.length|0], el=document.createElement("div"); el.className="rainCloud"; el.innerHTML=`<div class="in"><b>${esc(c.hun)}</b><span>${esc(c.eum)}</span></div>`;
    const W=box.clientWidth, x=20+Math.random()*Math.max(10,W-160); el.style.left=x+"px"; el.style.top="-60px"; box.appendChild(el);
    clouds.push({c,el,y:-60,x}); spawned++; markSeen(c.h); return true }
  function swapBtn(h){ const i=btns.findIndex(b=>b.h===h); if(i<0) return; for(let k=0;k<12;k++){ const c=nextHz(); if(!btns.some(b=>b.h===c.h)){ btns[i]=c; break } } drawBtns() }
  function press(i,b){ if(over) return; if(performance.now()<lockT){ msg.textContent="잠깐! 아무거나 막 누르면 버튼이 잠겨요"; return } const c=btns[i]; const hits=clouds.filter(k=>k.c.h===c.h).sort((a,b)=>b.y-a.y);
    if(hits.length){ const k=hits[0]; clouds.splice(clouds.indexOf(k),1); k.el.classList.add("pop"); setTimeout(()=>k.el.remove(),450); burst(k,c.h);
      cleared++; combo++; best=Math.max(best,combo); sfx(combo>=5?"crit":"ok"); trackAns(c,true); P.stats.q++; P.stats.c++; P.mastery[c.h]=(P.mastery[c.h]||0)+1;
      if(combo>0&&combo%5===0) stamp(`${combo}연속!`); b.classList.add("good"); setTimeout(()=>swapBtn(c.h),250); msg.textContent=`${c.h} = ${label(c)} 딩동댕!` }
    else { sfx("no"); combo=0; wrongs++; lockT=performance.now()+900; bw.style.opacity=".55"; setTimeout(()=>{ bw.style.opacity="" },900); b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad"); msg.textContent=`${c.h}(${label(c)})는 지금 떨어지는 구름에 없어요!` }
    hud(); checkEnd() }
  function checkEnd(){ if(over) return; if(lives<=0 || (spawned>=RAIN_N && !clouds.length)) end() }
  function loop(now){
    if(!document.body.contains(box)){ cancelAnimationFrame(raf); return }
    const dt=Math.min(.05,(now-last)/1000); last=now; if(over) return;
    acc+=dt; if(spawned<RAIN_N && acc>=gap && clouds.length<3){ if(spawn()){ acc=0; speed*=1.025; gap=Math.max(1.6,gap*.97) } }
    const H=box.clientHeight-90;
    for(const k of [...clouds]){ k.y+=speed*dt; k.el.style.top=k.y+"px"; if(k.y>H-150&&!k.low){ k.low=1; k.el.classList.add("low") }
      if(k.y>=H-84){ clouds.splice(clouds.indexOf(k),1); k.el.classList.add("splash"); setTimeout(()=>k.el.remove(),450);
        const bar=document.getElementById("rBar"); bar.classList.add("hit"); setTimeout(()=>bar.classList.remove("hit"),400); box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
        lives--; missed++; combo=0; sfx("hurt"); trackAns(k.c,false); P.stats.q++; addWrong(k.c.h); missList.push(k.c); msg.innerHTML=`놓쳤어요! <b>${esc(k.c.hun)} ${esc(k.c.eum)}</b> = <b class="hz">${esc(k.c.h)}</b>`; swapBtn(k.c.h); hud(); checkEnd() } }
    raf=requestAnimationFrame(loop) }
  function end(){ over=true; cancelAnimationFrame(raf); saveP();
    const score=cleared+Math.min(3,lives)*3+(missed===0&&cleared>=RAIN_N?6:0);
    const um=[...new Map(missList.map(c=>[c.h,c])).values()];
    rewardModal(lives>0?"한자 비를 모두 막았어요!":"한자 비 끝!",`구름 ${cleared}개를 막았어요 · 최고 ${best}연속 · 남은 목숨 ${lives}${um.length?`<br>다시 볼 한자: ${um.map(c=>`<b>${esc(c.h)}</b>(${esc(label(c))})`).join(", ")}`:""}${(()=>{ const ok=lives>0&&cleared+missed>=RAIN_N&&wrongs<=3; return !ok?`<p class="muted" style="color:#c8372d;font-weight:600">구름을 4개 이하로 놓치고, 잘못 누르기 3번 이하로 끝까지 막아야 코인을 받아요${wrongs?` (잘못 누름 ${wrongs}번)`:""}</p>`:missed>2?`<p class="muted" style="color:#b07a10;font-weight:600">구름 ${missed}개를 놓쳐서 코인 ×${missed===3?.7:.4} · 2개까지 놓치면 코인을 다 받아요!</p>`:"" })()}`,(lives>0&&cleared+missed>=RAIN_N&&wrongs<=3)?Math.max(1,Math.round(score*(missed<=2?1:missed===3?.7:.4))):0,()=>hanjaRain(list),cleared>=RAIN_N*.6) }
  hud(); raf=requestAnimationFrame(loop);
}

/* ===== 짝 맞추기 (예전 방식 · 지금은 메뉴에 없어요) ===== */
function match(list){
  const pairs=Math.min(6,list.length), picks=shuffle(list).slice(0,pairs);
  const tiles=shuffle(picks.flatMap(c=>[{id:c.h,kind:"hz",text:c.h},{id:c.h,kind:"tx",text:label(c)}]));
  let open=[],got=0,moves=0,lock=false; const t0=Date.now();
  picks.forEach(c=>markSeen(c.h));
  $app.innerHTML = topbar("학습 · 짝 맞추기") + `
    <div class="row"><span class="meta" id="mv">뒤집은 횟수 0</span><span class="meta" id="tm">0초</span></div>
    <div class="mgrid">${tiles.map((t,k)=>`<button class="tile" data-k="${k}" aria-label="카드 ${k+1}"><div class="in"><div class="fr">?</div><div class="bk2 ${t.kind}">${esc(t.text)}</div></div></button>`).join("")}</div>
    <p class="meta" style="margin:0;text-align:center">한자 카드와 뜻·소리 카드를 짝지어 보세요. 적게 뒤집을수록 코인이 많아요!</p>`;
  bindBack();
  const tm=document.getElementById("tm");
  const timer=setInterval(()=>{if(!document.body.contains(tm))return clearInterval(timer);tm.textContent=Math.round((Date.now()-t0)/1000)+"초"},1000);
  $app.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{
    if(lock||b.classList.contains("on")||b.classList.contains("got"))return;
    b.classList.add("on"); open.push(b); sfx("tap");
    if(open.length<2)return;
    moves++; document.getElementById("mv").textContent="뒤집은 횟수 "+moves;
    const [a,c]=open, ta=tiles[a.dataset.k], tc=tiles[c.dataset.k];
    if(ta.id===tc.id&&ta.kind!==tc.kind){
      a.classList.add("got");c.classList.add("got");open=[];got++;sfx("ok");
      const card=list.find(x=>x.h===ta.id); if(card) speak(label(card));
      if(got===pairs){clearInterval(timer);setTimeout(win,600)}
    } else {
      lock=true;a.classList.add("bad");c.classList.add("bad");sfx("no");
      setTimeout(()=>{a.classList.remove("on","bad");c.classList.remove("on","bad");open=[];lock=false},900);
    }
  });
  function win(){
    const sec=Math.round((Date.now()-t0)/1000), amt=moves<=pairs+2?20:moves<=pairs*2?14:10;

function dex(){
  if((P.set.dtab==="S"||P.set.dtab==="P")&&typeof sayDex==="function") return sayDex(P.set.dtab);
  if(P.set.dtab==="B"&&typeof bossCardDex==="function") return bossCardDex();
  const mastered=UNIQUE.filter(c=>(P.mastery[c.h]||0)>=MASTER_N).length, seen=UNIQUE.filter(c=>P.seen[c.h]).length;
  const shown=new Set();
  $app.innerHTML = topbar("도감") + (typeof dexTabs==="function"?dexTabs("H"):"") + `
  <section class="panel">
    <div class="dexHead"><div class="dexBar"><div class="prog"><div class="pt"><span>익힌 한자 (퀴즈·쓰기 테스트로 ${MASTER_N}번 성공)</span><b>${mastered} / ${UNIQUE.length}</b></div><div class="bar"><i style="width:${mastered/UNIQUE.length*100}%"></i></div></div></div>
    <span class="meta">만난 한자 ${seen}자 · 한자를 누르면 획순을 볼 수 있어요</span></div>
  </section>
  <div class="dexgrid">${WEEKS.map((w,i)=>`<div class="dweek"><h3>${i+1}주차</h3><div class="drow">${w.map(c=>{
      const dup=shown.has(c.h); shown.add(c.h); const m=(P.mastery[c.h]||0)>=MASTER_N, s=P.seen[c.h];
      return `<button class="dz ${m?"ms":s?"":"un"}" data-h="${esc(c.h)}" aria-label="${esc(label(c))}"><b>${s||m?esc(c.h):"?"}</b><small>${esc(c.eum)}</small></button>`}).join("")}</div></div>`).join("")}</div>`;
  bindBack(); if(typeof bindDexTabs==="function") bindDexTabs();
  $app.querySelectorAll(".dz").forEach(b=>b.onclick=()=>{const c=UNIQUE.find(x=>x.h===b.dataset.h); if(!P.seen[c.h]){toast("아직 만나지 않은 한자예요. 학습하기에서 만나 보세요!");return} openStroke(c)});
}

function todayWrong(back){ const L=todayWrongItems(), H=L.filter(x=>!x.say), S=L.filter(x=>x.say), done=L.filter(x=>x.done).length;
  $app.innerHTML = topbar("오늘 틀린 문제") + `<section class="panel">
    ${L.length?`<div class="twHead"><b>오늘 틀린 문제 ${L.length}개</b><span>${done?`✔ ${done}개 복습 완료 · `:""}다시 풀어서 맞히면 ✔가 붙어요</span><div class="twBar"><i style="width:${Math.round(done/L.length*100)}%"></i></div></div>
    ${H.length?`<h3 class="twH">한자 ${H.length}개</h3><div class="notelist">${H.map(x=>`<button class="note tw ${x.done?"ok":""}" data-h="${esc(x.h)}"><b>${esc(x.h)}</b><span>${esc(label(x.it))}</span><small>${x.done?"✔ 복습 완료":`${x.n}번 틀림 · 눌러서 획순`}</small></button>`).join("")}</div>`:""}
    ${S.length?`<h3 class="twH">사자성어·속담 ${S.length}개</h3><div class="notelist sayNotes">${S.map(x=>`<button class="note saynote tw ${x.done?"ok":""}" data-h="${esc(x.h)}"><b style="font-size:19px">${esc(x.it.k)}</b><span>${esc(x.it.t)}</span><small>${x.done?"✔ 복습 완료":`${SAY_NAME[x.it.cat]} · ${x.n}번 틀림`}</small></button>`).join("")}</div>`:""}
    <div class="btns">${H.length?`<button class="btn gold" id="twH">한자 다시 풀기</button>`:""}${["S","P"].filter(c=>S.some(x=>x.it.cat===c)).map(c=>`<button class="btn gold twS" data-c="${c}">${SAY_NAME[c]} 다시 풀기</button>`).join("")}</div>`
    :`<div style="text-align:center;padding:30px 10px"><h2>오늘 틀린 문제가 없어요 🎉</h2><p class="muted">게임이나 퀴즈에서 틀린 한자·사자성어·속담이 여기에 모여요.</p></div>`}
  </section>`;
  document.getElementById("back").onclick=()=>{ (back||home)() };

}
function notes(){
  const list=P.wrong.map(h=>UNIQUE.find(c=>c.h===h)).filter(Boolean);
  const TW=todayWrongItems();
  $app.innerHTML = topbar("오답 노트") + (TW.length?`<button class="twStrip" id="goTW2">📝 오늘 틀린 문제 ${TW.length}개 다시 보기<small>${TW.filter(x=>x.done).length}개 복습 완료</small></button>`:"") + `<section class="panel">${list.length?`

    <div class="notelist">${list.map(c=>`<button class="note" data-h="${esc(c.h)}"><b>${esc(c.h)}</b><span>${esc(label(c))}</span><small>${c.w}주차 · 눌러서 획순</small></button>`).join("")}</div>
    <div class="btns"><button class="btn ghost" id="nc">카드로 다시 보기</button><button class="btn gold" id="nq">오답 퀴즈</button></div>`
    :`<div style="text-align:center;padding:30px 10px;display:flex;flex-direction:column;gap:8px;align-items:center"><span style="width:72px;height:72px;display:block">${ICO.empty}</span><h2>오답 노트가 비어 있어요</h2><span class="muted">퀴즈에서 틀리거나 카드에서 "헷갈려요"를 누른 한자가 여기에 모여요.</span></div>`}</section>`;
  if(typeof sayNotesHtml==="function") $app.insertAdjacentHTML("beforeend",sayNotesHtml());
  bindBack(); if(typeof bindSayNotes==="function") bindSayNotes(); { const t=document.getElementById("goTW2"); if(t) t.onclick=()=>todayWrong(notes) } if(!list.length) return;
  $app.querySelectorAll(".note").forEach(b=>b.onclick=()=>openStroke(UNIQUE.find(c=>c.h===b.dataset.h)));

/* ===== 내 기록 ===== */
function rec(){
  const p=prof(), mastered=UNIQUE.filter(c=>(P.mastery[c.h]||0)>=MASTER_N).length, rate=P.stats.q?Math.round(P.stats.c/P.stats.q*100):0;
  const b=P.best;
  $app.innerHTML = topbar("내 기록") + `
  <section class="panel"><div class="row"><h2>${pname(p)}${p.name?` · ${esc(p.name)}`:""}</h2><span class="meta">이 태블릿에 저장된 기록이에요</span></div>
    <div class="stats">
      <div class="stat"><b>${P.earned}</b><span>지금까지 모은 코인</span></div>
      <div class="stat"><b>${mastered}<small style="font-size:16px;color:var(--muted)"> / ${UNIQUE.length}</small></b><span>익힌 한자</span></div>
      <div class="stat"><b>${P.stats.c}<small style="font-size:16px;color:var(--muted)"> / ${P.stats.q}</small></b><span>맞힌 문제 (정답률 ${rate}%)</span></div>
      <div class="stat"><b>${P.stats.sets}</b><span>끝낸 학습 세트</span></div>
      <div class="stat"><b>${b?fmtTime(b.t):"-"}</b><span>게임 최고 기록${b?` · 몬스터 ${b.k}마리`:""}</span></div>
      <div class="stat"><b>${P.wrong.length}</b><span>오답 노트 한자</span></div>
      ${typeof sayDoneWeeks==="function"?`<div class="stat"><b>${sayDoneWeeks()}<small style="font-size:16px;color:var(--muted)"> / ${SAY_WEEKS.S+SAY_WEEKS.P}</small></b><span>외운 사자성어·속담 주차</span></div>`:""}
    </div></section>
  <section class="panel"><div class="row"><h2>🏷 칭호</h2><span class="meta">${TITLES.filter(titleOwned).length} / ${TITLES.length} 모음 · 지금 장착: ${titleEq()?titlePill(titleEq()):"없음"}</span></div><button class="btn gold" id="recT">칭호함 열기</button></section>

    <div class="stampgrid">${WEEKS.map((_,i)=>P.done.includes(i+1)?`<span class="stp on" title="${i+1}주차 만점">★<small>${i+1}</small></span>`:`<span class="stp">${i+1}</span>`).join("")}</div></section>
  ${typeof SAY_WEEKS!=="undefined"?["S","P"].map(cat=>`<section class="panel"><div class="row"><h2>${SAY_NAME[cat]} 외운 주차 도장</h2><span class="meta">한 주차 4개를 모두 익히면 도장이 찍혀요 · ${sayDoneCount(cat)}/${SAY_WEEKS[cat]}</span></div>
    <div class="stampgrid">${Array.from({length:SAY_WEEKS[cat]},(_,i)=>i+1).map(w=>sayWeekDone(cat,w)?`<span class="stp on ${sayRevDue(cat,w)?"rv":""}" title="${w}주차 외움${sayRevDue(cat,w)?" · 복습할 때예요":""}">★<small>${w}</small></span>`:`<span class="stp">${w}</span>`).join("")}</div>
    ${sayTitle()?`<p class="meta" style="margin-top:8px">칭호: <b style="color:var(--gold);font-weight:400">${esc(sayTitle())}</b> · 공부 코인 ×${sayMul()}</p>`:""}</section>`).join(""):""}`;
  bindBack(); { const rt=document.getElementById("recT"); if(rt) rt.onclick=()=>titleBox(rec) }
  const rw=document.getElementById("rcWeak"); if(rw) rw.onclick=()=>{ const L=weakList(); if(L.length) quiz(L,{fromNotes:true}) };
  $app.querySelectorAll("[data-wk]").forEach(b=>b.onclick=()=>{ P.set.sel=[+b.dataset.wk]; saveP(); learn() });
}
function weakList(){ return Object.entries(P.wcnt||{}).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([h])=>UNIQUE.find(c=>c.h===h)).filter(Boolean) }
function reportCard(){
  const wk=P.wk||{}, weeks=Object.keys(wk).map(Number).sort((a,b)=>a-b), weak=weakList(), wc=P.wcnt||{};
  const week7=Object.entries(P.mt||{}).filter(([,t])=>Date.now()-t<7*864e5).map(([h])=>h);
  const low=weeks.map(w=>[w,wk[w][1]/wk[w][0]]).filter(([w,r])=>wk[w][0]>=5&&r<.7).sort((a,b)=>a[1]-b[1])[0];
  return `<section class="panel rcard"><div class="row"><h2>나의 한자 성적표</h2><span class="meta">퀴즈·게임·쓰기에서 푼 문제로 만들어요</span></div>
    ${low?`<div class="rcTip">💡 <b>${low[0]}주차</b> 정답률이 ${Math.round(low[1]*100)}%예요. 한 번 더 공부해 볼까요? <button class="btn gold sm" data-wk="${low[0]}">${low[0]}주차 공부하기</button></div>`:""}
    <div class="rcGrid">
      <div><h3>주차별 정답률</h3>${weeks.length?`<div class="rcBars">${weeks.map(w=>{ const [q,ok]=wk[w], r=Math.round(ok/q*100); return `<div class="rcB"><span>${w}주</span><i><em style="width:${r}%;background:${r>=85?"var(--jade)":r>=60?"var(--gold)":"var(--red)"}"></em></i><b>${r}%</b></div>` }).join("")}</div>`:`<p class="muted">아직 푼 문제가 없어요</p>`}</div>
      <div><h3>자주 틀린 한자</h3>${weak.length?`<div class="rcWeak">${weak.map(c=>`<span><b>${esc(c.h)}</b>${esc(label(c))}<small>${wc[c.h]}번 틀림</small></span>`).join("")}</div><button class="btn red" id="rcWeak" style="margin-top:8px">이 한자만 다시 퀴즈</button>`:`<p class="muted">틀린 한자가 없어요. 대단해요!</p>`}</div>
      <div><h3>이번 주에 익힌 한자</h3>${week7.length?`<div class="rcNew">${week7.map(h=>`<b>${esc(h)}</b>`).join("")}</div><p class="muted" style="margin:6px 0 0">${week7.length}자를 새로 익혔어요!</p>`:`<p class="muted">이번 주에 새로 익힌 한자가 아직 없어요</p>`}</div>
    </div></section>` }
const fmtTime = t=>{t=Math.floor(t);return `${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`};

    <div id="rstc" hidden class="row"><span style="color:#ff9aab;font-family:var(--f-ui);font-size:19px">정말 모두 지울까요? 되돌릴 수 없어요.</span><div class="row" style="gap:8px"><button class="btn red" id="rsty">지우기</button><button class="btn ghost" id="rstn">취소</button></div></div>
