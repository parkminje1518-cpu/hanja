<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한자 탐험대</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gowun+Dodum&family=Noto+Serif+KR:wght@600;900&family=Press+Start+2P&display=swap">
<style>
/* 밤의 탐험 게임판 + 한지 문제 카드. 한 화면에 한 가지 일, 큰 터치 버튼. 일부러 어두운 한 가지 모습만 씀 */
:root{
  --bg:#130f26; --bg2:#1b1636; --panel:#221c44; --line:#3b3270; --text:#f3effd; --muted:#a79fcb;
  --gold:#f6c544; --gold-d:#a8780f; --red:#e9475f; --red-d:#94203a; --jade:#3fcf8e; --jade-d:#1d7a53; --sky:#63b0ff;
  --paper:#f4e7c7; --paper-ink:#2b2216; --paper-line:#cdb68a;
  --f-title:"Black Han Sans","Do Hyeon",system-ui,sans-serif;
  --f-ui:"Do Hyeon","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-px:"Press Start 2P",ui-monospace,monospace;
  --f-hz:"Noto Serif KR","Nanum Myeongjo","Batang",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:17px;line-height:1.5;min-height:100%;
  background-image:radial-gradient(circle at 20% 0%,rgba(99,176,255,.10),transparent 40%),radial-gradient(circle at 90% 10%,rgba(233,71,95,.10),transparent 35%),
  radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.5px);background-size:auto,auto,26px 26px;background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere}
#app{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;background:none;border:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
[hidden]{display:none!important}
.eyebrow{font-family:var(--f-px);font-size:10px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
.muted{color:var(--muted)}
h2{font-family:var(--f-ui);font-weight:400;font-size:26px;margin:0;line-height:1.2;text-wrap:balance}
h3{font-family:var(--f-ui);font-weight:400;margin:0}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}

/* 버튼 */
.btn{font-family:var(--f-ui);font-size:20px;border-radius:12px;padding:12px 20px;min-height:54px;border:3px solid transparent;transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(3px)}
.btn.gold{background:var(--gold);color:#2a1d00;border-color:#ffe08a;box-shadow:0 5px 0 var(--gold-d)}
.btn.red{background:var(--red);color:#fff;border-color:#ff8597;box-shadow:0 5px 0 var(--red-d)}
.btn.jade{background:var(--jade);color:#06281a;border-color:#8af0c1;box-shadow:0 5px 0 var(--jade-d)}
.btn.ghost{background:var(--bg2);border-color:var(--line);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.btn.big{font-size:22px;min-height:62px}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}

/* 코인, 상단 */
.coin{display:inline-flex;align-items:center;gap:8px;background:var(--bg2);border:2px solid var(--gold-d);border-radius:12px;padding:5px 12px 5px 6px;font-family:var(--f-ui);font-size:20px;font-variant-numeric:tabular-nums}
.coin i,.ci{font-style:normal;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#5a3d00;font-family:var(--f-hz);font-weight:900;font-size:15px;box-shadow:inset 0 -3px 0 var(--gold-d)}
.coin.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.15)}}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.back{font-family:var(--f-ui);font-size:19px;color:var(--muted);padding:8px 4px;min-height:44px}
.top .ttl{font-family:var(--f-ui);font-size:22px;flex:1;text-align:center;min-width:0}

/* 타이틀 */
.titleBlock{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding-block:14px 4px}
.bigTitle{font-family:var(--f-title);font-weight:400;font-size:clamp(46px,11vw,92px);line-height:1;color:var(--gold);letter-spacing:.02em;margin:0;
  text-shadow:3px 3px 0 #b5361f,6px 6px 0 #4a1530,9px 9px 0 rgba(0,0,0,.35)}
.subTitle{font-family:var(--f-px);font-size:10px;color:var(--muted);letter-spacing:.14em}
.floatHz{position:relative}
.floatHz span{position:absolute;font-family:var(--f-hz);font-weight:900;color:rgba(246,197,68,.13);pointer-events:none}

/* 등록 */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-family:var(--f-ui);font-size:18px}
.fields2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.seg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.seg button,.seg2 button{background:var(--bg2);border:2px solid var(--line);border-radius:10px;min-height:52px;font-family:var(--f-ui);font-size:19px}
.seg button[aria-pressed="true"],.seg2 button[aria-pressed="true"]{background:var(--gold);color:#2a1d00;border-color:#ffe08a}
.seg2{display:flex;gap:8px;flex-wrap:wrap}
.seg2 button{padding:0 18px}
select,input[type=text],input[type=password]{background:var(--bg2);border:2px solid var(--line);border-radius:10px;min-height:54px;padding:0 14px;font-size:20px;font-family:var(--f-ui);width:100%}
.err{color:#ff9aab;font-family:var(--f-ui);font-size:18px;min-height:1.4em;margin:0}
.plist{display:flex;flex-wrap:wrap;gap:10px}
.pchip{display:flex;align-items:center;gap:10px;background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:8px 14px 8px 8px;min-height:56px;font-family:var(--f-ui);font-size:18px;text-align:left}
.ava{flex:none;width:40px;height:40px;border-radius:10px;background:var(--sky);color:#0b2238;display:grid;place-items:center;font-family:var(--f-ui);font-size:20px}

/* 홈 */
.homeTop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px 14px 6px 6px;font-family:var(--f-ui);font-size:18px;text-align:left;min-height:54px}
.who small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);line-height:1.2}
.statusRow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.statusRow span{background:var(--bg2);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-size:15px}
.statusRow .stairTag{border-color:#c9a23a;color:#ffe9a8}
.statusRow b{font-family:var(--f-ui);font-weight:400;color:var(--gold);font-size:18px}
.bigBtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.bigBtn{position:relative;display:flex;align-items:center;gap:14px;text-align:left;border-radius:16px;padding:20px 18px;min-height:128px;border:3px solid;transition:transform .08s}
.bigBtn:active{transform:translateY(4px)}
.bigBtn.gold{background:linear-gradient(#ffd765,var(--gold));color:#2a1d00;border-color:#ffe9a3;box-shadow:0 7px 0 var(--gold-d)}
.bigBtn.red{background:linear-gradient(#ff6a80,var(--red));color:#fff;border-color:#ff9cab;box-shadow:0 7px 0 var(--red-d)}
.bigBtn .num{position:absolute;top:10px;left:12px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.18);display:grid;place-items:center;font-family:var(--f-px);font-size:10px}
.bigBtn .bi{flex:none;width:72px;height:72px;border-radius:14px;background:rgba(0,0,0,.16);display:grid;place-items:center;font-family:var(--f-hz);font-weight:900;font-size:42px}
.bigBtn strong{display:block;font-family:var(--f-title);font-weight:400;font-size:clamp(26px,4.4vw,36px);line-height:1.1}
.bigBtn small{display:block;font-size:14px;opacity:.85;margin-top:4px;line-height:1.35}
.menu4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.menu4 button{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-ui);font-size:18px;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.menu4 i{font-style:normal;font-family:var(--f-hz);font-weight:900;font-size:30px;color:var(--gold);line-height:1.2}
.menu4 small{font-family:var(--f-body);font-size:12px;color:var(--muted)}

/* 주차, 활동 */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:9px}
.wk{position:relative;aspect-ratio:1;max-width:100%;background:var(--bg2);border:2px solid var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-ui);font-size:22px;line-height:1.1}
.wk small{font-size:11px;color:var(--muted);font-family:var(--f-body)}
.wk[aria-pressed="true"]{background:var(--gold);border-color:#ffe08a;color:#2a1d00}
.wk[aria-pressed="true"] small{color:#5a3d00}
.wk .done{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-family:var(--f-hz);font-size:12px;display:grid;place-items:center;border:2px solid var(--bg)}
.chip{background:var(--bg2);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:15px;min-height:40px}
.preview{font-family:var(--f-hz);font-weight:600;font-size:24px;color:var(--muted);letter-spacing:.15em;min-height:36px}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.act{display:flex;align-items:center;gap:14px;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px;min-height:104px;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.act .ai{flex:none;width:60px;height:60px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-hz);font-weight:900;font-size:32px}
.act strong{display:block;font-family:var(--f-ui);font-weight:400;font-size:22px}
.act small{display:block;color:var(--muted);font-size:14px;line-height:1.35}
.act .rw{display:inline-flex;align-items:center;gap:4px;margin-top:4px;color:var(--gold);font-family:var(--f-ui);font-size:15px}
.ai.y{background:rgba(246,197,68,.18);color:var(--gold)} .ai.r{background:rgba(233,71,95,.2);color:#ff8a9c}
.ai.g{background:rgba(63,207,142,.18);color:var(--jade)} .ai.b{background:rgba(99,176,255,.18);color:var(--sky)}

/* 퀴즈 */
.qtop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.prog .pt{display:flex;justify-content:space-between;font-family:var(--f-ui);font-size:17px;margin-bottom:6px}
.prog .pt b{font-weight:400;color:var(--gold);font-variant-numeric:tabular-nums}
.bar{height:16px;background:var(--bg2);border:2px solid var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--gold) 0 10px,#ffd96f 10px 20px);transition:width .3s}
.reward{background:var(--bg2);border:2px solid var(--gold-d);border-radius:12px;padding:6px 14px;text-align:center;min-width:132px}
.reward b{display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--f-ui);font-weight:400;font-size:26px;color:var(--gold);font-variant-numeric:tabular-nums}
.reward small{display:block;font-size:12px;color:var(--muted)}
.reward.pop b{animation:bump .35s}
.qwrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:stretch}
.qcard{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:26px 24px;display:flex;flex-direction:column;gap:12px;justify-content:center;min-height:300px;
  border:4px solid #e2cc9b;box-shadow:0 0 0 3px #8a6a32,0 8px 0 3px rgba(0,0,0,.35)}
.qcard::before,.qcard::after{content:"";position:absolute;width:14px;height:14px;background:#8a6a32;transform:rotate(45deg)}
.qcard::before{top:10px;left:10px}.qcard::after{bottom:10px;right:10px}
.qtag{align-self:flex-start;background:#3a2c18;color:var(--gold);font-family:var(--f-ui);font-size:15px;border-radius:6px;padding:2px 10px}
.qbig{font-family:var(--f-hz);font-weight:900;font-size:clamp(90px,16vw,150px);line-height:1;text-align:center}
.qq{font-family:var(--f-title);font-weight:400;font-size:clamp(26px,4.4vw,38px);line-height:1.25;text-wrap:balance}
.qhint{border-top:2px dashed var(--paper-line);padding-top:10px;font-size:15px;color:#6b5634}
.qopts{display:flex;flex-direction:column;gap:12px;justify-content:center}
.qo{display:flex;align-items:center;gap:14px;background:var(--bg2);border:3px solid var(--line);border-radius:12px;min-height:72px;padding:8px 14px;text-align:left;font-family:var(--f-ui);font-size:24px;transition:background .15s,opacity .2s}
.qo .L{flex:none;width:34px;height:34px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-family:var(--f-px);font-size:12px}
.qo .T{flex:1;min-width:0}
.qo.hz .T{font-family:var(--f-hz);font-weight:900;font-size:38px;line-height:1}
.swq{font-style:normal;display:inline-block;min-width:1.1em;border:2px dashed #ffd36a;border-radius:6px;color:#ffd36a;text-align:center;line-height:1.1;margin:0 1px}
.memoAct{grid-column:1/-1;border-color:#e9475f;background:linear-gradient(110deg,#3a1630,#25163a);box-shadow:0 5px 0 #7a1a3a}
.act .ai.mm{background:#e9475f;color:#fff}
.memoStar{font-style:normal;font-size:14px;background:#ffd36a;color:#3a1630;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.memoScore{font-family:var(--f-ui);font-size:15px;text-align:center;color:var(--muted)}
.memoScore b{color:var(--gold);font-weight:400}
.mres{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.mres .mr{display:flex;flex-direction:column;align-items:center;padding:6px 10px;border-radius:10px;background:#2a2340;font-size:13px}
.mres .mr b{font-family:var(--f-hz);font-size:30px;line-height:1.1}
.mres .l0{background:#1f5a3c}.mres .l1{background:#2c4a6a}.mres .l3{background:#5a1f2a}
.rainHud{width:100%;box-sizing:border-box;max-width:760px;margin:6px auto;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;font-family:var(--f-ui)}
.rainShield{display:flex;gap:5px}.rainShield i{width:30px;height:12px;border-radius:6px;background:linear-gradient(#ffe9a0,#f6b51e);box-shadow:0 0 10px rgba(255,210,90,.8),inset 0 -3px 0 rgba(0,0,0,.2);transition:.3s}
.rainShield i.off{background:#2a2440;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
.rainProg{height:10px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}.rainProg b{display:block;height:100%;width:0;background:linear-gradient(90deg,#6ad0ff,#b28cff);border-radius:6px;transition:width .3s}
.rainCombo{min-width:84px;text-align:right;color:#ffd36a;font-size:18px;text-shadow:0 0 12px rgba(255,180,60,.8)}
.rainBox{position:relative;width:100%;box-sizing:border-box;height:min(54vh,440px);max-width:760px;margin:0 auto;border-radius:22px;overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 80% at 50% 110%,#ff9a6a 0%,#c8508a 22%,#4a2a7a 48%,#160f36 78%,#0a0820 100%);box-shadow:0 0 0 2px #3a2a6a,0 18px 40px rgba(0,0,0,.45),inset 0 0 60px rgba(0,0,0,.5)}
.rainBox .stars{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 32% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 58% 22%,#ffe,transparent),radial-gradient(1px 1px at 78% 12%,#fff,transparent),radial-gradient(1.2px 1.2px at 88% 30%,#fff,transparent),radial-gradient(1px 1px at 22% 34%,#cdf,transparent),radial-gradient(1.4px 1.4px at 45% 40%,#fff,transparent),radial-gradient(1px 1px at 68% 44%,#fff,transparent);animation:rtw 3s ease-in-out infinite alternate;opacity:.9}
@keyframes rtw{to{opacity:.45}}
.rainBox .moon{position:absolute;right:9%;top:9%;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe6,#ffe6a0 60%,#e8b860);box-shadow:0 0 40px 10px rgba(255,230,160,.35)}
.rainBox .mtn{position:absolute;left:-5%;right:-5%;bottom:58px;height:46%;background:linear-gradient(#2a1a4a,#1a1030);clip-path:polygon(0 100%,0 62%,9% 40%,17% 55%,27% 22%,37% 50%,46% 34%,55% 58%,64% 28%,74% 48%,83% 18%,92% 44%,100% 30%,100% 100%);opacity:.9}
.rainBox .mtn.b{bottom:58px;height:30%;background:linear-gradient(#3a2058,#20123a);clip-path:polygon(0 100%,0 55%,12% 30%,24% 60%,36% 35%,50% 62%,62% 32%,76% 58%,88% 36%,100% 56%,100% 100%);opacity:1}
.rainBox .fog{position:absolute;left:-30%;width:160%;bottom:70px;height:70px;background:radial-gradient(50% 50% at 50% 50%,rgba(255,200,230,.22),transparent 70%);animation:rfog 14s linear infinite}
@keyframes rfog{from{transform:translateX(-10%)}to{transform:translateX(10%)}}
.rainBox .town{position:absolute;left:0;right:0;bottom:0;height:62px;background:linear-gradient(#1a1030,#0c0818);}
.rainBox .town:before{content:"";position:absolute;left:0;right:0;top:-22px;height:24px;background:#120b26;clip-path:polygon(0 100%,3% 60%,8% 40%,13% 60%,15% 100%,20% 100%,23% 55%,29% 30%,35% 55%,38% 100%,44% 100%,47% 62%,52% 42%,57% 62%,60% 100%,66% 100%,69% 50%,75% 28%,81% 50%,84% 100%,89% 100%,92% 58%,96% 40%,100% 58%,100% 100%)}
.rainBox .town:after{content:"";position:absolute;inset:8px 0 auto 0;height:8px;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,200,110,.85) 22px 28px,transparent 28px 60px);filter:blur(.4px)}
.rainBarrier{position:absolute;left:3%;right:3%;bottom:44px;height:46px;border-radius:50% 50% 0 0/100% 100% 0 0;border-top:3px solid rgba(255,220,130,.95);background:linear-gradient(rgba(255,220,130,.28),transparent 70%);box-shadow:0 -6px 24px rgba(255,200,90,.55);z-index:3;transition:.25s}
.rainBarrier.hit{border-color:#ff5a6a;box-shadow:0 -6px 30px rgba(255,60,80,.9);background:linear-gradient(rgba(255,60,90,.4),transparent 70%)}
.rainBox.shake{animation:rshk .35s}@keyframes rshk{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.rainMsg{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-family:var(--f-ui);font-size:16px;color:#ffe9c0;z-index:4;text-shadow:0 2px 6px #000}
.rainMsg .hz{font-family:var(--f-hz);font-size:22px;color:#ffd36a}
.rainCloud{position:absolute;width:132px;height:84px;z-index:2;transform:translateZ(0)}
.rainCloud:before{content:"";position:absolute;inset:4px 0 0 0;border-radius:44px 44px 36px 36px;background:radial-gradient(70% 90% at 40% 25%,#6a5aa8,#3a2c6a 60%,#241a48);box-shadow:inset 0 -8px 14px rgba(0,0,0,.35),inset 0 6px 10px rgba(255,255,255,.12),0 0 18px rgba(150,120,255,.45)}
.rainCloud:after{content:"";position:absolute;left:14px;right:14px;top:78px;height:46px;background:repeating-linear-gradient(105deg,transparent 0 9px,rgba(160,200,255,.55) 9px 11px);mask:linear-gradient(#000,transparent);-webkit-mask:linear-gradient(#000,transparent);animation:rdrip .5s linear infinite}
@keyframes rdrip{from{background-position:0 0}to{background-position:0 22px}}

function hanjaWeight(c){ const m=(P.mastery||{})[c.h]||0, wc=(P.wcnt||{})[c.h]||0, inW=(P.wrong||[]).includes(c.h);
  return 1 + Math.min(6,wc)*1.2 + (inW?3:0) + Math.max(0,MASTER_N-m)*0.9 + ((P.seen||{})[c.h]?0:1.2) }

    out.push(pool[k]); pool.splice(k,1) } return out }

/* 높은 주차일수록 코인을 더 많이: 고른 주차 평균이 1주차면 ×1.0, 26주차면 ×2.0 */
/* 많은 주차를 함께 고를수록 + 높은 주차까지 고를수록 코인이 늘어요 (1~26주차 전체 ×3) */
function weekMul(){ const sel=(P&&P.set&&P.set.sel)||[]; if(!sel.length) return 1; const mx=Math.max(...sel); return Math.round((1+.8*(mx-1)/25+1.2*(sel.length-1)/25)*10)/10 }
/* 코인 벌기: 하루 한도(DAILY_COIN_MAX)까지만 들어가요. 실제로 들어간 코인을 돌려줘요 */
function coinLeft(){ if(isAdmin()) return 1e9; const d=day(); return Math.max(0,DAILY_COIN_MAX-(d.coin||0)) }
function earn(n){ n=Math.max(0,Math.round(n||0)); if(!n||!P) return 0; const d=day(); const a=Math.min(n,coinLeft()); d.coin=(d.coin||0)+a; P.coins+=a; P.earned+=a; saveP(); return a }
function capNote(){ return coinLeft()<=0?`오늘 코인 한도 ${DAILY_COIN_MAX}개를 다 채웠어요. 공부와 게임은 계속 할 수 있어요!`:"" }
function grantSet(amount,raw,final){
  if(!raw&&!final) amount=amount*weekMul();
  const d=day(); P.stats.sets++;
  if(!final) amount=Math.max(1,Math.round(amount*(d.sets>=DAILY_SETS?STAIR[STAIR.length-1]:stairMul(d.sets))));
  if(d.sets>=DAILY_SETS){ saveP(); return {got:0,limited:true,exp:addExp(Math.round(amount*0.75))} }
  const st=stairMul(d.sets); d.sets++; const got=earn(amount); saveP();
  return {stair:st,got,capped:got<amount,limited:false,exp:addExp(Math.round(amount*1.5))};
}

/* ===== 오늘의 한자: 하루 한 글자, 약한 한자 중에서 골라요 ===== */
function todayHanja(){ const sel=(P.set.sel&&P.set.sel.length)?Math.max(...P.set.sel):5, pool=[...new Map(WEEKS.slice(0,Math.max(3,sel)).flat().map(c=>[c.h,c])).values()];
  let seed=0; for(const ch of todayKey()+curId) seed=(seed*31+ch.charCodeAt(0))>>>0;
  const ws=pool.map(hanjaWeight), tot=ws.reduce((a,b)=>a+b,0); let r=(seed%10000)/10000*tot, k=0; while(r>ws[k]&&k<ws.length-1){ r-=ws[k]; k++ } return pool[k] }
function todayHtml(){ const c=todayHanja(), done=P.daily&&P.daily.todayHz===todayKey(), W=wordsOf(c.h);
  return `<div class="todayHz" id="todayHz"><div class="thBig">${done?esc(c.h):"?"}</div><div class="thTxt"><small>오늘의 한자 · ${c.w}주차${done?"":" · 한자는 써 보고 나서 공개!"}</small><b>${esc(c.hun)} ${esc(c.eum)}</b>${W.length?`<span>${W.map(w=>`${done?esc(w[0]):esc(w[0]).split(esc(c.h)).join("?")}(${esc(w[1])})`).join(" · ")}</span>`:""}</div>

  const draw=()=>{ const g=P_[i], last=i===P_.length-1;

      <h2 class="gdTitle">${g.n?`<span class="n">${g.n}</span>`:""}${g.t}</h2>
      <p class="gdText">${g.x}</p>
      ${g.tip?`<div class="gdTip"><i>꿀팁</i><span>${g.tip}</span></div>`:""}
      <div class="gdDots">${P_.map((_,k)=>`<span class="${k===i?"on":""}"></span>`).join("")}</div>
      <div class="gdNav"><button class="btn ghost" id="gdP" ${i?"":"disabled"}>◀ 이전</button><button class="btn gold" id="gdN">${last?"다 읽었어요!":"다음 ▶"}</button></div>`;
    modal.hidden=false;
    const done=()=>{ if(P&&!P.guideSeen){ P.guideSeen=true; saveP() } closeModal() };
    document.getElementById("gdX").onclick=done;
    document.getElementById("gdP").onclick=()=>{ if(i>0){ i--; sfx("flip"); draw() } };
    document.getElementById("gdN").onclick=()=>{ if(last){ sfx("win"); done() } else { i++; sfx("flip"); draw() } };
  };
  draw();
}

function HS(id){ id=id||P.hero; P.hl=P.hl||{}; if(!P.hl[id]) P.hl[id]={lv:1,exp:0,pts:0,hp:0,atk:0,spd:0,tier:0}; return P.hl[id] }
const jobTitle = id=>JOBS[id].titles[HS(id).tier];
const canAdvance = id=>{ const s=HS(id); return s.tier<4 && s.lv>=JOB_LV[s.tier] };
function addExp(n){
  if(!P||!(n>0)) return 0;
  const s=HS(); if(s.lv>=MAX_LV) return 0;
  n=Math.max(1,Math.round(n*HERO_EXP_RATE*((heroById(P.hero).perks||{}).xp||1))); s.exp+=n; let ups=0;
  while(s.lv<MAX_LV && s.exp>=expNeed(s.lv)){ s.exp-=expNeed(s.lv); s.lv++; s.pts++; ups++ }
  if(s.lv>=MAX_LV) s.exp=0;
  saveP();

  return n;
}

const comboGain = k=>Math.min(10,3*k);   // 연속 정답 보상 (5문제 만점이면 48코인)
const quizMax = n=>{let s=0;for(let k=1;k<=n;k++)s+=comboGain(k);return s+10};
/* 지금 받을 수 있는 코인 (주차 배율 × 공부 계단) */

/* ===== 퀴즈 ===== */
function makeQ(c,opt){ opt=opt||{};
  const others=shuffle(UNIQUE.filter(x=>x.h!==c.h));
  const pick=key=>{const seen=new Set([key(c)]),out=[];for(const o of others){const k=key(o);if(!seen.has(k)){seen.add(k);out.push(o)}if(out.length===3)break}return shuffle([c,...out])};
  const W=typeof wordsOf==="function"?wordsOf(c.h):[];
  const types=["he","toh","eum","hun"]; if(W.length){ types.push("inword"); if(!opt.short) types.push("word") }
  const t=types[Math.random()*types.length|0];
  if(t==="inword"){ const w=W[Math.random()*W.length|0], wrong=shuffle(others.flatMap(o=>wordsOf(o.h)).filter(x=>!x[0].includes(c.h))).slice(0,3);
    return {c,tag:"낱말 찾기",big:null,q:`'${label(c)}'이 들어간 낱말은?`,opts:shuffle([w,...wrong]).map(x=>({text:x[0],hz:true,rd:x[1],ok:x===w})),word:w} }
  if(t==="word"){ const w=W[Math.random()*W.length|0], wrong=shuffle(others.flatMap(o=>wordsOf(o.h)).filter(x=>x[2]!==w[2])).slice(0,3);
    return {c,tag:"낱말 뜻",big:w[0],q:`'${w[1]}'(${w[0]})의 뜻은?`,opts:shuffle([w,...wrong]).map(x=>({text:x[2].replace(/ \(.+\)$/,""),ok:x===w})),word:w} }
  if(t==="he")  return {c,tag:"뜻과 소리",big:c.h,q:"이 한자의 뜻과 소리는?",opts:pick(label).map(o=>({text:label(o),ok:o.h===c.h}))};
  if(t==="toh") return {c,tag:"한자 찾기",big:null,q:`'${label(c)}'에 알맞은 한자는?`,opts:pick(label).map(o=>({text:o.h,hz:true,ok:o.h===c.h}))};
  if(t==="eum") return {c,tag:"소리(음)",big:c.h,q:"이 한자는 어떻게 읽을까요?",opts:pick(o=>o.eum).map(o=>({text:o.eum,ok:o.eum===c.eum}))};
  return {c,tag:"뜻(훈)",big:c.h,q:"이 한자의 뜻은?",opts:pick(o=>o.hun).map(o=>({text:o.hun,ok:o.hun===c.hun}))};
}
function quiz(list,{fromNotes=false}={}){
  const N=P.set.qn;
  const src=shuffle(pickWeighted(list,N));
  const qs=src.map(c=>makeQ(c));
  let i=0, right=0, combo=0, pend=0, best=0, miss=[], busy=false, hintUsed=0; const WM=weekMul();
  const SM=(()=>{ const d=day(); return d.sets>=DAILY_SETS?0:stairMul(d.sets) })();   // 공부 계단 배율 (보이는 코인 = 실제 코인)
  const shown=()=>Math.min(pend,coinLeft());
  function draw(){
    const q=qs[i]; markSeen(q.c.h);
    $app.innerHTML = topbar(fromNotes?"오답 퀴즈":"학습 · 퀴즈") + `
    <div class="qtop">
      <div class="prog"><div class="pt"><span>학습 진행</span><b>${i+1} / ${N}</b></div><div class="bar"><i style="width:${i/N*100}%"></i></div></div>
      <div class="reward" id="rw"><div class="eyebrow">REWARD</div><b>${ico("coin","ci")}+<span id="pend">${shown()}</span></b><small id="cmb">${combo>=2?`${combo}연속 정답!`:"연속 정답이면 더 많이"}</small></div>
    </div>
    <div class="qwrap">
      <div class="qcard"><span class="qtag"># 문제 ${i+1} · ${q.tag}</span>${q.big?`<div class="qbig">${esc(q.big)}</div>`:""}<div class="qq">${esc(q.q)}</div><div class="qhint">4개 보기 중 알맞은 것을 골라요!</div></div>
      <div class="qopts">
        ${q.opts.map((o,k)=>`<button class="qo ${o.hz?"hz":""}" data-k="${k}"><span class="L">${"ABCD"[k]}</span><span class="T">${esc(o.text)}</span><span class="gain"></span></button>`).join("")}
        <div class="qtools">
          <button id="hint" ${P.coins<HINT_COST?"disabled":""}>힌트 ${ico("coin","ci")}-${HINT_COST}</button>
          <button id="skip">건너뛰기</button>
          <span class="combo">STREAK ${combo}</span>
        </div>
      </div>
    </div>`;
    bindBack();
    const btns=[...$app.querySelectorAll(".qo")];
    document.getElementById("hint").onclick=e=>{
      if(busy||P.coins<HINT_COST) return;
      setCoins(P.coins-HINT_COST); hintUsed+=HINT_COST; sfx("tap");
      shuffle(btns.filter(b=>!q.opts[+b.dataset.k].ok)).slice(0,2).forEach(b=>{b.classList.add("cut");b.disabled=true});
      e.currentTarget.disabled=true;
    };
    document.getElementById("skip").onclick=()=>{ if(busy) return; answer(null) };
    btns.forEach(b=>b.onclick=()=>{ if(!busy) answer(b) });
    function answer(b){
      busy=true;
      btns.forEach(x=>{x.disabled=true; const o=q.opts[+x.dataset.k]; if(o.ok){x.classList.add("ok");x.classList.remove("cut")} if(o.rd) x.querySelector(".T").insertAdjacentHTML("beforeend",`<small class="qrd">${esc(o.rd)}</small>`)});
      const ok = b && q.opts[+b.dataset.k].ok;
      P.stats.q++; trackAns(q.c,!!ok);
      if(ok){
        right++; combo++; best=Math.max(best,combo); const g=Math.round(comboGain(combo)*WM*SM); pend+=g;
        b.querySelector(".gain").textContent="+"+g;
        document.getElementById("pend").textContent=shown(); document.getElementById("cmb").textContent=combo>=2?`${combo}연속 정답!`:"정답!";
        const rw=document.getElementById("rw"); rw.classList.remove("pop"); void rw.offsetWidth; rw.classList.add("pop");
        P.stats.c++; P.mastery[q.c.h]=(P.mastery[q.c.h]||0)+1; if(fromNotes) delWrong(q.c.h);
        sfx("ok"); if(combo>=3) stamp(`${combo}연속!`); speak(label(q.c));
      } else {
        combo=0; if(b) b.classList.add("no"); miss.push(q.c); addWrong(q.c.h); sfx("no");
        document.getElementById("cmb").textContent=b?"아쉬워요!":"건너뛰었어요";
      }
      saveP();
      setTimeout(()=>{ i++; busy=false; i<N?draw():finish() }, ok?1000:1700);
    }
  }
  function finish(){
    const perfect = right===N;
    if(perfect) pend+=Math.round(10*WM*SM);
    const r = grantSet(pend,true,true); r.stair=SM||r.stair;
    if(perfect && !fromNotes && P.set.sel.length){ P.set.sel.forEach(w=>{if(!P.done.includes(w))P.done.push(w)}); saveP() }
    const um=[...new Map(miss.map(c=>[c.h,c])).values()];
    modal.dataset.dismiss="no";
    openModal(`<div class="eyebrow">COMPLETE</div><h3>${perfect?"만점! 학습 완료!":"학습 완료!"}</h3>
      <p>맞힌 문제 <b style="font-family:var(--f-ui);font-size:24px;color:var(--gold)">${right} / ${N}</b> · 최고 ${best}연속</p>
      <div class="mc">${ico("coin","ci")}+${r.got}</div>${r.exp?`<p class="expline">${heroById(P.hero).name} 경험치 +${r.exp}</p>`:""}
      ${r.capped||coinLeft()<=0?`<p class="muted" style="color:#c8372d">${capNote()||"오늘 코인 한도에 거의 닿았어요"}</p>`:""}<p class="muted">${r.limited?`오늘 코인 받는 세트 ${DAILY_SETS}개를 모두 썼어요. 내일 또 받을 수 있어요.`:`${perfect?`만점 보너스 +${Math.round(10*WM*SM)} 포함 · `:""}${hintUsed?`힌트 -${hintUsed} 사용 · `:""}${WM>1?`높은 주차 보너스 ×${WM} · `:""}공부 계단 ×${r.stair} · 오늘 보상 ${day().sets}/${DAILY_SETS} 세트`}</p>
      ${um.length?`<div class="eyebrow">다시 볼 한자</div><div class="misslist">${um.map(c=>`<span><b>${esc(c.h)}</b>${esc(label(c))}</span>`).join("")}</div>`:""}
      <button class="btn gold big" id="take">${r.got?"코인 받기":"확인"}</button>
      <div class="btns" id="after" hidden><button class="btn ghost" id="again">한 번 더</button>${um.length?`<button class="btn red" id="rev">틀린 것 카드로</button>`:""}<button class="btn ghost" id="mm">메인으로</button></div>`);
    if(perfect) setTimeout(()=>stamp("만점!"),200);
    document.getElementById("take").onclick=e=>{
      e.currentTarget.hidden=true; document.getElementById("after").hidden=false;
      if(r.got){ sfx("coin"); countUp(P.coins-r.got,P.coins) }
    };
    document.getElementById("again").onclick=()=>{modal.dataset.dismiss="";closeModal();quiz(list,{fromNotes})};
    document.getElementById("mm").onclick=()=>{modal.dataset.dismiss="";closeModal();home()};
    const rv=document.getElementById("rev"); if(rv) rv.onclick=()=>{modal.dataset.dismiss="";closeModal();cards(um,{fromNotes:true})};
  }
  draw();
}
function countUp(from,to){
  const b=document.getElementById("coinN"), p=document.getElementById("coinPill"); if(!b) return;
  const t0=performance.now(), D=700;
  (function step(t){const k=Math.min(1,(t-t0)/D); b.textContent=Math.round(from+(to-from)*k); if(k<1) requestAnimationFrame(step); else {p.classList.remove("bump");void p.offsetWidth;p.classList.add("bump")}})(t0);
}
function rewardModal(title,body,amount,again){

function cards(list,{fromNotes=false}={}){
  let order=[...list], i=0; const seen=new Set();
  function draw(){
    const c=order[i]; markSeen(c.h);
    $app.innerHTML = topbar(fromNotes?"오답 카드":"학습 · 한자 카드") + `
    <div class="prog"><div class="pt"><span>뒤집어 본 카드 ${seen.size} / ${order.length}</span><b>${i+1} / ${order.length}</b></div><div class="bar"><i style="width:${(i+1)/order.length*100}%"></i></div></div>
    <button class="flip" id="flip" aria-label="카드 뒤집기"><div class="in">
      <div class="face"><span class="wtag">${c.w}주차</span><div class="h">${esc(c.h)}</div><div class="hint">눌러서 뜻과 소리 보기</div></div>
      <div class="face bk"><span class="wtag">${c.w}주차</span><div class="sm">${esc(c.h)}</div><div class="hun">${esc(c.hun)} <em>${esc(c.eum)}</em></div>${wordsOf(c.h).length?`<div class="cwords">${wordsOf(c.h).map(w=>`<span><b>${esc(w[0])}</b> ${esc(w[1])}<small>${esc(w[2])}</small></span>`).join("")}</div>`:""}</div>
    </div></button>
    <div class="btns">
      <button class="btn ghost" id="prev" ${i?"":"disabled"}>◀ 이전</button>
      <button class="btn ghost" id="stk">획순 보기</button>
      ${canSpeak?`<button class="btn ghost" id="say">소리 듣기</button>`:""}
      <button class="btn red" id="hard">헷갈려요</button>
      <button class="btn jade" id="know">알아요 ▶</button>
    </div>`;
    bindBack();
    const f=document.getElementById("flip");
    f.onclick=()=>{f.classList.toggle("on");seen.add(c.h);sfx("flip")};
    document.getElementById("prev").onclick=()=>{i--;draw()};
    document.getElementById("stk").onclick=()=>openStroke(c);
    if(canSpeak) document.getElementById("say").onclick=()=>{const v=P.set.voice;P.set.voice=true;speak(label(c));P.set.voice=v};
    document.getElementById("hard").onclick=()=>{addWrong(c.h);next()};
    document.getElementById("know").onclick=()=>{if(fromNotes)delWrong(c.h);next()};
  }
  function next(){ if(i<order.length-1){i++;draw()} else finish() }
  function finish(){
    const all=order.every(c=>seen.has(c.h));
    /* 카드 보기는 복습용이라 코인은 없어요. 퀴즈로 확인하면 코인을 받아요 */
    modal.dataset.dismiss="";
    openModal(`<h3>카드를 다 봤어요!</h3><p>${all?"":"아직 뒤집지 않은 카드도 있어요. "}이제 <b>퀴즈</b>로 정말 외웠는지 확인해 볼까요? 퀴즈를 풀면 코인을 받아요.</p>
    <div class="btns"><button class="btn gold" id="qz">퀴즈로 확인하기</button><button class="btn ghost" id="again">카드 다시 보기</button><button class="btn ghost" id="mm">메인으로</button></div>`);
    document.getElementById("qz").onclick=()=>{closeModal();quiz(list,{fromNotes})};
    document.getElementById("again").onclick=()=>{closeModal();cards(list,{fromNotes})};
    document.getElementById("mm").onclick=()=>{closeModal();home()};
  }
  draw();
}

/* ===== 낱말 만들기: 뜻과 읽기를 보고 한자 조각을 순서대로 골라 낱말을 완성해요 ===== */
const BUILD_N = 5, BUILD_MAX = 5*3+5;   // 한 번에 막힘없이 만들면 3, 다 끝내면 +5
function buildWords(list){
  const tasks=pickWeighted(list.filter(c=>wordsOf(c.h).length),BUILD_N).map(c=>{ const W=wordsOf(c.h); return {c,w:W[Math.random()*W.length|0]} });
  if(!tasks.length){ toast("이 주차에는 낱말이 없어요"); return }
  let i=0, score=0, clean=0, miss=[];
  function draw(){
    const {c,w}=tasks[i], chars=[...w[0]], rd=[...w[1].replace(/\s/g,"")], same=rd.length===chars.length;
    const used=new Set([...chars, ...rd]);   // 헷갈리지 않게: 같은 소리 한자는 방해 조각에서 빼요
    const dis=shuffle(UNIQUE.filter(o=>!chars.includes(o.h) && !rd.includes(o.eum))).slice(0,Math.max(3,6-chars.length));
    const tiles=shuffle([...chars.map((h,k)=>({h,k})), ...dis.map(o=>({h:o.h,k:-1}))]);
    let pos=0, mistakes=0, hint=false;
    $app.innerHTML = topbar("학습 · 낱말 만들기") + `
    <div class="prog"><div class="pt"><span>완성한 낱말 ${i} / ${tasks.length}</span><b>${i+1} / ${tasks.length}</b></div><div class="bar"><i style="width:${i/tasks.length*100}%"></i></div></div>
    <div class="bwCard">
      <div class="bwTag">${c.w}주차 · '${esc(label(c))}'이 들어간 낱말</div>
      <div class="bwMean">“${esc(w[2])}”</div>
      <div class="bwRead">읽기: <b>${esc(w[1])}</b></div>
      <div class="bwSlots">${chars.map((_,k)=>`<span class="bwSlot" data-s="${k}">${same?`<small>${esc(rd[k])}</small>`:""}</span>`).join("")}</div>
      <div class="bwMsg" id="bwMsg">소리에 맞는 한자를 <b>순서대로</b> 눌러요</div>
    </div>
    <div class="bwTiles">${tiles.map((t,n)=>`<button class="bwTile" data-n="${n}"><b>${esc(t.h)}</b><small class="bwEum" hidden>${esc((UNIQUE.find(o=>o.h===t.h)||{}).eum||(t.k>=0&&same?rd[t.k]:"?"))}</small></button>`).join("")}</div>
    <div class="btns"><button class="btn ghost" id="bwHint">힌트: 조각에 소리 보이기</button></div>`;
    bindBack();
    const msg=document.getElementById("bwMsg"), slots=[...$app.querySelectorAll(".bwSlot")];
    document.getElementById("bwHint").onclick=e=>{ hint=true; e.currentTarget.disabled=true; $app.querySelectorAll(".bwEum").forEach(x=>x.hidden=false); msg.textContent="힌트를 썼어요. 소리를 보고 골라 봐요!" };
    $app.querySelectorAll(".bwTile").forEach(b=>b.onclick=()=>{
      const t=tiles[+b.dataset.n]; if(b.disabled) return;
      if(t.h===chars[pos]){ sfx("ok"); b.disabled=true; b.classList.add("used"); const sl=slots[pos]; sl.classList.add("on"); sl.insertAdjacentHTML("afterbegin",`<b>${esc(t.h)}</b>`); pos++;
        if(pos>=chars.length) done() }
      else { sfx("no"); mistakes++; b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); msg.innerHTML=mistakes>=2&&!hint?"어려우면 <b>힌트</b>를 눌러 봐요!":"그 한자가 아니에요. 소리를 다시 생각해 봐요!" } });
    function done(){
      const ok=mistakes===0&&!hint; if(ok){ score+=3; clean++ } else if(mistakes<=1) score+=1;
      trackAns(c,ok); P.stats.q++; if(ok){ P.stats.c++; P.mastery[c.h]=(P.mastery[c.h]||0)+1 } else { addWrong(c.h); miss.push(c) } markSeen(c.h); saveP();
      const parts=chars.map(h=>{ const o=UNIQUE.find(x=>x.h===h); return o?`<span><b>${esc(h)}</b> ${esc(label(o))}</span>`:`<span><b>${esc(h)}</b></span>` }).join(" + ");
      msg.innerHTML=`${ok?"완벽해요! ":"완성! "}<b>${esc(w[0])}</b>(${esc(w[1])}) = ${esc(w[2])}<div class="bwParts">${parts}</div>`;
      stamp(ok?"딱 맞아요!":"완성!"); speak(w[1]);
      $app.querySelector(".btns").innerHTML=`<button class="btn jade big" id="bwNext">${i<tasks.length-1?"다음 낱말 ▶":"결과 보기"}</button>`;
      $app.querySelectorAll(".bwTile").forEach(x=>x.disabled=true);
      document.getElementById("bwNext").onclick=()=>{ i++; i<tasks.length?draw():finish() } }
  }
  function finish(){
    const um=[...new Map(miss.map(c=>[c.h,c])).values()];
    rewardModal("낱말 만들기 완료!",`${tasks.length}개 중 <b>${clean}개</b>를 힌트 없이 한 번에 만들었어요!${um.length?`<br>다시 볼 한자: ${um.map(c=>`<b>${esc(c.h)}</b>(${esc(label(c))})`).join(", ")}`:""}`,score+5,()=>buildWords(list));
  }
  draw();
}

/* ===== 한자 비: 위에서 뜻·소리 구름이 내려와요. 땅에 닿기 전에 맞는 한자 버튼을 눌러 막아요 ===== */
const RAIN_N = 20, RAIN_MAX = 20+3*3+6;   // 막은 구름 1개당 1 · 남은 목숨 1개당 3 · 하나도 안 놓치면 +6
function hanjaRain(list){
  const uniq=[...new Map(list.map(c=>[c.h,c])).values()];
  if(uniq.length<3){ toast("한자를 3개 이상 골라 주세요"); return }
  const NB=Math.min(6,uniq.length);
  let lives=3, spawned=0, cleared=0, missed=0, combo=0, best=0, speed=42, gap=2.3, acc=1.6, last=performance.now(), raf=0, over=false;
  const order=pickWeighted(uniq,Math.min(uniq.length,40)); let oi=0;
  const nextHz=()=>{ const c=order[oi%order.length]; oi++; return c };
  let btns=[]; while(btns.length<NB){ const c=nextHz(); if(!btns.some(b=>b.h===c.h)) btns.push(c) }
  const clouds=[]; const missList=[];
  $app.innerHTML = topbar("학습 · 한자 비") + `
    <div class="rainHud"><div class="rainShield" id="rLives"></div><div class="rainProg"><b id="rProg"></b></div><div class="rainCombo" id="rCombo"></div></div>
    <div class="rainBox" id="rainBox"><div class="stars"></div><div class="moon"></div><div class="mtn"></div><div class="fog"></div><div class="mtn b"></div><div class="town"></div><div class="rainBarrier" id="rBar"></div>
      <div class="rainMsg" id="rMsg">먹구름이 마을로 내려와요! 뜻·소리에 맞는 한자를 눌러 막아요</div></div>
    <div class="rainBtns" id="rainBtns"></div>`;
  bindBack();
  const box=document.getElementById("rainBox"), bw=document.getElementById("rainBtns"), msg=document.getElementById("rMsg");
  function drawBtns(){ bw.innerHTML=btns.map((c,i)=>`<button class="rainBtn" data-i="${i}">${esc(c.h)}</button>`).join("");
    bw.querySelectorAll(".rainBtn").forEach(b=>b.onpointerdown=e=>{ e.preventDefault(); press(+b.dataset.i,b) }) }
  drawBtns();
  function hud(){ document.getElementById("rLives").innerHTML=[0,1,2].map(i=>`<i class="${i<lives?"":"off"}"></i>`).join(""); document.getElementById("rProg").style.width=((cleared+missed)/RAIN_N*100)+"%"; document.getElementById("rCombo").textContent=combo>=3?`🔥 ${combo}연속`:`${cleared} / ${RAIN_N}` }
  function burst(k,h){ const bx=k.x+66, by=k.y+44; const b=document.createElement("div"); b.className="rainBurst"; b.textContent=h; b.style.left=bx+"px"; b.style.top=by+"px"; box.appendChild(b); setTimeout(()=>b.remove(),700);
    for(let i=0;i<12;i++){ const p=document.createElement("i"); p.className="rainSpark"; const a=i/12*Math.PI*2, d=50+Math.random()*40; p.style.left=bx+"px"; p.style.top=by+"px"; p.style.setProperty("--dx",Math.cos(a)*d+"px"); p.style.setProperty("--dy",Math.sin(a)*d+"px"); box.appendChild(p); setTimeout(()=>p.remove(),600) } }
  function spawn(){
    const active=new Set(clouds.map(k=>k.c.h)); const cand=btns.filter(b=>!active.has(b.h)); if(!cand.length) return false;
    const c=cand[Math.random()*cand.length|0], el=document.createElement("div"); el.className="rainCloud"; el.innerHTML=`<div class="in"><b>${esc(c.hun)}</b><span>${esc(c.eum)}</span></div>`;
    const W=box.clientWidth, x=20+Math.random()*Math.max(10,W-160); el.style.left=x+"px"; el.style.top="-60px"; box.appendChild(el);
    clouds.push({c,el,y:-60,x}); spawned++; markSeen(c.h); return true }
  function swapBtn(h){ const i=btns.findIndex(b=>b.h===h); if(i<0) return; for(let k=0;k<12;k++){ const c=nextHz(); if(!btns.some(b=>b.h===c.h)){ btns[i]=c; break } } drawBtns() }
  function press(i,b){ if(over) return; const c=btns[i]; const hits=clouds.filter(k=>k.c.h===c.h).sort((a,b)=>b.y-a.y);
    if(hits.length){ const k=hits[0]; clouds.splice(clouds.indexOf(k),1); k.el.classList.add("pop"); setTimeout(()=>k.el.remove(),450); burst(k,c.h);
      cleared++; combo++; best=Math.max(best,combo); sfx(combo>=5?"crit":"ok"); trackAns(c,true); P.stats.q++; P.stats.c++; P.mastery[c.h]=(P.mastery[c.h]||0)+1;
      if(combo>0&&combo%5===0) stamp(`${combo}연속!`); b.classList.add("good"); setTimeout(()=>swapBtn(c.h),250); msg.textContent=`${c.h} = ${label(c)} 딩동댕!` }
    else { sfx("no"); combo=0; b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad"); msg.textContent=`${c.h}(${label(c)})는 지금 떨어지는 구름에 없어요!` }
    hud(); checkEnd() }
  function checkEnd(){ if(over) return; if(lives<=0 || (spawned>=RAIN_N && !clouds.length)) end() }
  function loop(now){
    if(!document.body.contains(box)){ cancelAnimationFrame(raf); return }
    const dt=Math.min(.05,(now-last)/1000); last=now; if(over) return;
    acc+=dt; if(spawned<RAIN_N && acc>=gap && clouds.length<3){ if(spawn()){ acc=0; speed*=1.045; gap=Math.max(1.05,gap*.95) } }
    const H=box.clientHeight-90;
    for(const k of [...clouds]){ k.y+=speed*dt; k.el.style.top=k.y+"px"; if(k.y>H-150&&!k.low){ k.low=1; k.el.classList.add("low") }
      if(k.y>=H-84){ clouds.splice(clouds.indexOf(k),1); k.el.classList.add("splash"); setTimeout(()=>k.el.remove(),450);
        const bar=document.getElementById("rBar"); bar.classList.add("hit"); setTimeout(()=>bar.classList.remove("hit"),400); box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
        lives--; missed++; combo=0; sfx("hurt"); trackAns(k.c,false); P.stats.q++; addWrong(k.c.h); missList.push(k.c); msg.innerHTML=`놓쳤어요! <b>${esc(k.c.hun)} ${esc(k.c.eum)}</b> = <b class="hz">${esc(k.c.h)}</b>`; swapBtn(k.c.h); hud(); checkEnd() } }
    raf=requestAnimationFrame(loop) }
  function end(){ over=true; cancelAnimationFrame(raf); saveP();
    const score=cleared+lives*3+(missed===0&&cleared>=RAIN_N?6:0);
    const um=[...new Map(missList.map(c=>[c.h,c])).values()];
    rewardModal(lives>0?"한자 비를 모두 막았어요!":"한자 비 끝!",`구름 ${cleared}개를 막았어요 · 최고 ${best}연속 · 남은 목숨 ${lives}${um.length?`<br>다시 볼 한자: ${um.map(c=>`<b>${esc(c.h)}</b>(${esc(label(c))})`).join(", ")}`:""}`,Math.max(1,score),()=>hanjaRain(list)) }
  hud(); raf=requestAnimationFrame(loop);
}

/* ===== 짝 맞추기 (예전 방식 · 지금은 메뉴에 없어요) ===== */
function match(list){
  const pairs=Math.min(6,list.length), picks=shuffle(list).slice(0,pairs);
  const tiles=shuffle(picks.flatMap(c=>[{id:c.h,kind:"hz",text:c.h},{id:c.h,kind:"tx",text:label(c)}]));
  let open=[],got=0,moves=0,lock=false; const t0=Date.now();
  picks.forEach(c=>markSeen(c.h));
  $app.innerHTML = topbar("학습 · 짝 맞추기") + `
    <div class="row"><span class="meta" id="mv">뒤집은 횟수 0</span><span class="meta" id="tm">0초</span></div>
    <div class="mgrid">${tiles.map((t,k)=>`<button class="tile" data-k="${k}" aria-label="카드 ${k+1}"><div class="in"><div class="fr">?</div><div class="bk2 ${t.kind}">${esc(t.text)}</div></div></button>`).join("")}</div>
    <p class="meta" style="margin:0;text-align:center">한자 카드와 뜻·소리 카드를 짝지어 보세요. 적게 뒤집을수록 코인이 많아요!</p>`;
  bindBack();
  const tm=document.getElementById("tm");
  const timer=setInterval(()=>{if(!document.body.contains(tm))return clearInterval(timer);tm.textContent=Math.round((Date.now()-t0)/1000)+"초"},1000);
  $app.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{
    if(lock||b.classList.contains("on")||b.classList.contains("got"))return;
    b.classList.add("on"); open.push(b); sfx("tap");
    if(open.length<2)return;
    moves++; document.getElementById("mv").textContent="뒤집은 횟수 "+moves;
    const [a,c]=open, ta=tiles[a.dataset.k], tc=tiles[c.dataset.k];
    if(ta.id===tc.id&&ta.kind!==tc.kind){
      a.classList.add("got");c.classList.add("got");open=[];got++;sfx("ok");
      const card=list.find(x=>x.h===ta.id); if(card) speak(label(card));
      if(got===pairs){clearInterval(timer);setTimeout(win,600)}
    } else {
      lock=true;a.classList.add("bad");c.classList.add("bad");sfx("no");
      setTimeout(()=>{a.classList.remove("on","bad");c.classList.remove("on","bad");open=[];lock=false},900);
    }
  });
  function win(){
    const sec=Math.round((Date.now()-t0)/1000), amt=moves<=pairs+2?20:moves<=pairs*2?14:10;
    stamp("짝짝짝!"); sfx("win");
    rewardModal("짝 맞추기 성공!",`${moves}번 뒤집어서 ${sec}초 만에 ${pairs}쌍을 찾았어요.`,amt,()=>match(list));
  }
}

/* ===== 획순 ===== */
const HW_OK = typeof HanziWriter!=="undefined" && typeof STROKES!=="undefined";
const wait = ms=>new Promise(r=>setTimeout(r,ms));
let curWriter=null;
function run0(){ if(curWriter){try{curWriter.cancelQuiz()}catch(e){}} curWriter=null }
function strokePanel(host,c,{trace=false,memo=false,today=false}={}){
  run0();
  const data=HW_OK&&STROKES[c.h];
  if(!data){
    host.innerHTML=`<div class="sw"><div class="sinfo"><span class="hun">${esc(c.hun)} <em>${esc(c.eum)}</em></span></div>
      <div class="stage" style="display:grid;place-items:center;color:var(--paper-ink)"><span style="font-family:var(--f-hz);font-weight:900;font-size:min(50vw,200px);line-height:1">${esc(c.h)}</span></div>
      <p class="meta" style="text-align:center;margin:0">이 글자는 획순 그림이 아직 없어요. 학습지의 획순을 함께 봐 주세요.</p></div>`;
    return;
  }
  const n=data.strokes.length;
  host.innerHTML=`<div class="sw">
    <div class="sinfo"><span class="hun">${esc(c.hun)} <em>${esc(c.eum)}</em></span><span class="cnt">총 ${n}획</span></div>
    ${wordsOf(c.h).length?`<div class="swords">${wordsOf(c.h).map(w=>`<span><b class="swMask">${esc(w[0]).split(esc(c.h)).join('<i class="swq">?</i>')}</b><b class="swFull" hidden>${esc(w[0])}</b> ${esc(w[1])} <small>${esc(w[2].replace(/ \(.+\)$/,""))}</small></span>`).join("")}</div>`:""}
    <div class="stage"><svg class="mi" viewBox="0 0 100 100" aria-hidden="true"><line x1="50" y1="0" x2="50" y2="100"/><line x1="0" y1="50" x2="100" y2="50"/><line x1="0" y1="0" x2="100" y2="100"/><line x1="100" y1="0" x2="0" y2="100"/></svg><div class="hwt"></div></div>
    <div class="smsg" aria-live="polite"></div>
    <div class="btns"><button class="btn gold" data-a="all">획순 보기</button><button class="btn ghost" data-a="step">한 획씩 (0/${n})</button><button class="btn jade" data-a="quiz">따라 쓰기</button><button class="btn red" data-a="memo">기억해서 쓰기 ×2</button></div></div>`;
  const stage=host.querySelector(".stage"), msg=host.querySelector(".smsg"), stepBtn=host.querySelector('[data-a="step"]');
  const size=Math.floor(stage.getBoundingClientRect().width)-6||300;
  const w=HanziWriter.create(host.querySelector(".hwt"),c.h,{width:size,height:size,padding:Math.round(size*.07),showCharacter:false,showOutline:true,
    strokeAnimationSpeed:.55,delayBetweenStrokes:0,strokeColor:"#2b2216",outlineColor:"#d8c49b",highlightColor:"#e9475f",drawingColor:"#1d7a53",
    drawingWidth:Math.max(14,Math.round(size/18)),showHintAfterMisses:2,highlightOnComplete:true,charDataLoader:(ch,done)=>done(STROKES[ch])});
  curWriter=w;
  let run=0, step=0;
  const setStep=k=>{step=k;stepBtn.textContent=k>=n?"한 획씩 (처음부터)":`한 획씩 (${k}/${n})`};
  async function playAll(){ const id=++run; w.cancelQuiz(); setStep(0); await w.hideCharacter({duration:0});
    for(let k=0;k<n;k++){ if(id!==run||curWriter!==w) return; msg.textContent=`${k+1}획째`; await w.animateStroke(k); setStep(k+1); await wait(550) }
    if(id===run) msg.textContent=`${n}획으로 완성!` }
  async function oneStep(){ const id=++run; w.cancelQuiz(); if(step===0||step>=n){await w.hideCharacter({duration:0});setStep(0)}
    if(id!==run) return; msg.textContent=`${step+1}획째`; const k=step; setStep(k+1); await w.animateStroke(k); if(id===run&&k+1>=n) msg.textContent=`${n}획으로 완성!` }
  function doTrace(isMemo){ ++run; setStep(0); w.hideCharacter({duration:0}); if(isMemo){ w.hideOutline({duration:0}); stage.classList.add("memo") } else { w.showOutline({duration:0}); stage.classList.remove("memo") }
    msg.textContent=isMemo?`'${label(c)}'을 떠올리며 빈칸에 직접 써 보세요! (3번 틀리면 힌트)`:"1획부터 순서대로 따라 써 보세요"; let miss=0;
    w.quiz({showHintAfterMisses:isMemo?3:2,onMistake:()=>{miss++;msg.textContent=isMemo?(miss>=3?"힌트가 깜빡여요! 따라 그어 보세요":"음, 다시 떠올려 볼까요?"):(miss>=2?"빨갛게 깜빡이는 곳을 따라 그어 보세요":"다시 한번 그어 보세요")},
      onCorrectStroke:s=>{sfx("stroke");msg.textContent=s.strokesRemaining?`좋아요! ${s.strokeNum+2}획째`:""},
      onComplete:s=>{ const good=s.totalMistakes<=2; host.querySelectorAll(".swMask").forEach(x=>x.hidden=true); host.querySelectorAll(".swFull").forEach(x=>x.hidden=false); sfx("win"); stamp(good?(isMemo?"기억<br>완벽!":"참<br>잘했어요"):"완성!"); w.showOutline({duration:300}); stage.classList.remove("memo");
        const d=day(); d.tc=d.tc||{}; let add=0;
        /* 같은 글자는 하루 2번까지만 코인 · 오늘의 한자는 하루 한 번만 */
        const capHz=(d.tc[c.h]||0)>=TRACE_PER_HZ, capToday=today && P.daily.todayHz===todayKey();
        if(capHz||capToday){ trackAns(c,good); P.mastery[c.h]=(P.mastery[c.h]||0)+(good?(isMemo?2:1):0); saveP() }
        else if(d.trace<TRACE_DAILY_MAX){ d.tc[c.h]=(d.tc[c.h]||0)+1; add=Math.min(Math.round(TRACE_COIN*weekMul()*(isMemo?2:1)),TRACE_DAILY_MAX-d.trace); add=earn(add); d.trace+=add; addExp(add*2); P.mastery[c.h]=(P.mastery[c.h]||0)+(good?(isMemo?2:1):0); trackAns(c,good); saveP(); countUp(P.coins-add,P.coins) }
        let bonus=0; if(today && isMemo && P.daily.todayHz!==todayKey()){ P.daily.todayHz=todayKey(); bonus=earn(10); saveP(); if(bonus) setTimeout(()=>{ sfx("coin"); toast(`오늘의 한자 완료! 보너스 코인 +${bonus}`) },700) }
        msg.textContent=(good?"완벽해요!":`완성! 틀린 횟수 ${s.totalMistakes}번`)+(add?`  코인 +${add}`:coinLeft()<=0?"  (오늘 코인 한도를 다 채웠어요)":capToday?"  (오늘의 한자 코인은 하루 한 번! 연습은 계속 할 수 있어요)":capHz?"  (이 글자는 오늘 코인을 다 받았어요 · 다른 글자를 써 봐요)":"  (오늘 획순 코인은 다 받았어요)")+(bonus?`  · 오늘의 한자 +${bonus}`:"") }});
  }

/* ===== 기억해서 쓰기 도전: 한자 모양을 외워서 획순대로 써요 (가장 큰 보상) ===== */
const MEMO_N = 5, MEMO_PER = [10,6,2], MEMO_DONE = 10, MEMO_MAX = MEMO_N*MEMO_PER[0]+MEMO_DONE;
function memoTest(list){
  if(!HW_OK){ toast("획순 데이터가 없어서 쓸 수 없어요"); return }
  const items=pickWeighted(list.filter(c=>STROKES[c.h]),MEMO_N);
  if(!items.length){ toast("쓸 수 있는 한자가 없어요"); return }
  let i=0, score=0; const res=[];
  function draw(){
    const c=items[i], data=STROKES[c.h], n=data.strokes.length; markSeen(c.h);
    $app.innerHTML = topbar("학습 · 기억해서 쓰기 도전") + `<section class="panel">
      <div class="prog"><div class="pt"><span>${c.w}주차 · 지금 ${score}점</span><b>${i+1} / ${items.length}</b></div><div class="bar"><i style="width:${i/items.length*100}%"></i></div></div>
      <div class="sw"><div class="sinfo"><span class="hun">${esc(c.hun)} <em>${esc(c.eum)}</em></span><span class="cnt">총 ${n}획</span></div>
      ${wordsOf(c.h).length?`<div class="swords">${wordsOf(c.h).map(w=>`<span><b class="swMask">${esc(w[0]).split(esc(c.h)).join('<i class="swq">?</i>')}</b><b class="swFull" hidden>${esc(w[0])}</b> ${esc(w[1])} <small>${esc(w[2].replace(/ \(.+\)$/,""))}</small></span>`).join("")}</div>`:""}
      <div class="stage memo"><svg class="mi" viewBox="0 0 100 100" aria-hidden="true"><line x1="50" y1="0" x2="50" y2="100"/><line x1="0" y1="50" x2="100" y2="50"/><line x1="0" y1="0" x2="100" y2="100"/><line x1="100" y1="0" x2="0" y2="100"/></svg><div class="hwt"></div></div>
      <div class="smsg" aria-live="polite">'${esc(label(c))}'의 모양을 떠올려 <b>1획부터 순서대로</b> 써 보세요!</div>
      <div class="memoScore">점수: 완벽(실수 0) <b>${MEMO_PER[0]}점</b> · 실수 2번까지 <b>${MEMO_PER[1]}점</b> · 그 밖에 <b>${MEMO_PER[2]}점</b> · 점수가 높을수록 코인을 많이 받아요</div>
      <div class="btns"><button class="btn ghost" id="peek">모양 살짝 보기 (점수 ↓)</button><button class="btn ghost" id="mskip">모르겠어요</button></div></div></section>`;
    bindBack();
    const host=$app.querySelector(".sw"), stage=host.querySelector(".stage"), msg=host.querySelector(".smsg");
    const size=Math.floor(stage.getBoundingClientRect().width)-6||300;
    run0();
    const w=HanziWriter.create(host.querySelector(".hwt"),c.h,{width:size,height:size,padding:Math.round(size*.07),showCharacter:false,showOutline:false,
      strokeAnimationSpeed:.8,delayBetweenStrokes:60,strokeColor:"#2b2216",outlineColor:"#d8c49b",highlightColor:"#e9475f",drawingColor:"#1d7a53",
      drawingWidth:Math.max(14,Math.round(size/18)),showHintAfterMisses:3,highlightOnComplete:true,charDataLoader:(ch,done)=>done(STROKES[ch])});
    curWriter=w;
    let peeked=false, finished=false, miss=0;
    function end(s,skip){
      if(finished) return; finished=true;
      const lvl=skip?3:peeked||s.totalMistakes>2?2:s.totalMistakes>0?1:0, pts=skip?0:MEMO_PER[lvl];
      score+=pts; const ok=!skip&&lvl===0; res.push({c,pts,lvl:skip?3:lvl});
      trackAns(c,ok); P.stats.q++; if(ok){ P.stats.c++; P.mastery[c.h]=(P.mastery[c.h]||0)+2 } else if(lvl>=2) addWrong(c.h); saveP();
      host.querySelectorAll(".swMask").forEach(x=>x.hidden=true); host.querySelectorAll(".swFull").forEach(x=>x.hidden=false);
      if(skip){ w.cancelQuiz(); w.showOutline({duration:0}); w.animateCharacter(); msg.innerHTML=`이렇게 써요! <b>${esc(c.h)}</b> (${esc(label(c))}) · 다음엔 꼭 기억해요`; sfx("no") }
      else { w.showOutline({duration:300}); sfx(lvl===0?"win":"ok"); stamp(lvl===0?"기억<br>완벽!":lvl===1?"잘했어요":"완성!"); msg.innerHTML=`${["완벽해요!","거의 완벽!","완성!"][lvl]} <b>+${pts}점</b>${s.totalMistakes?` · 실수 ${s.totalMistakes}번`:""}${peeked?" · 살짝 봄":""}` }
      $app.querySelector(".btns").innerHTML=`<button class="btn jade big" id="mnext">${i<items.length-1?"다음 글자 ▶":"결과 보기"}</button>`;
      document.getElementById("mnext").onclick=()=>{ run0(); i++; i<items.length?draw():finish() } }
    w.quiz({showHintAfterMisses:3,
      onMistake:()=>{ miss++; msg.textContent=miss>=3?"힌트가 깜빡여요! 순서에 맞는 획을 그어 보세요":"그 획이 아니에요. 순서를 다시 떠올려 봐요!" },
      onCorrectStroke:s=>{ sfx("stroke"); msg.textContent=s.strokesRemaining?`좋아요! ${s.strokeNum+2}획째`:"" },
      onComplete:s=>end(s,false)});
    document.getElementById("peek").onclick=e=>{ if(peeked||finished) return; peeked=true; e.currentTarget.disabled=true;
      w.showOutline({duration:200}); setTimeout(()=>{ if(!finished) w.hideOutline({duration:300}) },1500); msg.textContent="1.5초만 보여 줄게요. 잘 기억해요!" };
    document.getElementById("mskip").onclick=()=>end(null,true);
  }
  function finish(){
    const perfect=res.filter(r=>r.lvl===0).length;
    const list2=res.map(r=>`<span class="mr l${r.lvl}"><b>${esc(r.c.h)}</b>${["완벽","잘함","완성","몰라요"][r.lvl]}</span>`).join("");
    rewardModal("기억해서 쓰기 도전 완료!",`${items.length}글자 중 <b>${perfect}글자</b>를 완벽하게 기억했어요!<div class="mres">${list2}</div>`,score+MEMO_DONE,()=>memoTest(list));
  }
  draw();
}

  document.getElementById("sv").onclick=e=>{P.set.voice=!P.set.voice;saveP();e.currentTarget.setAttribute("aria-checked",P.set.voice)};
  document.getElementById("sb").onclick=e=>{P.set.bgm=P.set.bgm===false;saveP();e.currentTarget.setAttribute("aria-checked",P.set.bgm);SND.bgm(P.set.bgm?"home":null)};
  document.getElementById("ss").onclick=e=>{P.set.sfx=!P.set.sfx;saveP();e.currentTarget.setAttribute("aria-checked",P.set.sfx);sfx("tap")};
  document.getElementById("rst").onclick=()=>document.getElementById("rstc").hidden=false;
  document.getElementById("rstn").onclick=()=>document.getElementById("rstc").hidden=true;
  document.getElementById("rsty").onclick=()=>{const s=P.set; P=blankP(); P.set=s; saveP(); toast("기록을 처음부터 시작해요"); settings()};
}

document.querySelectorAll(".game").forEach(e=>e.remove());
document.body.style.overflow="";
picker(); moveBar();
if(/#import=/.test(location.hash)){ try{ askImport(unpackData(location.hash)) }catch(e){ toast("기록을 읽지 못했어요. 코드로 다시 해 주세요") } }
</script>
